<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>review: {{PLAN_NAME}}</title>
    <!-- Self-contained: no external fonts, scripts, or styles. Zero network egress.
         UI components styled after the Terminus UI design system (Button, Badge,
         Card, Textarea, Popover, Separator) — adapted as vanilla CSS, no React. -->
    <style>
      :root {
        --background: #111110; --card: #191918; --card-foreground: #eeeeec;
        --popover: #222221; --foreground: #eeeeec;
        --muted: #222221; --muted-foreground: #b5b3ad; --border: #3b3a37; --input: #3b3a37;
        --primary: #978365; --primary-foreground: #ffffff; --primary-hover: #a39073;
        --primary-muted: #24231f; --primary-text: #cbb99f; --ring: #978365; --accent: #2a2a28;
        --success: #71d083; --success-muted: #1b2a1e; --success-border: #2d5736;
        --warning: #ffca16; --warning-muted: #302008; --warning-border: #5c3d05;
        --destructive: #ff977d; --destructive-muted: #391714; --destructive-border: #6e2920;
        --info: #70b8ff; --info-muted: #0d2847; --info-border: #104d87;
        --hl: rgba(255, 202, 22, 0.30); --hl-active: rgba(255, 202, 22, 0.55);
        --outline: rgba(237, 237, 236, 0.08); --subtle: #686560;
        --radius: 0.25rem; --radius-md: 0.25rem;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          /* Terminus UI — light, sampled from the design system */
          --background: #f6f5ef; --card: #fcfbf6; --card-foreground: #36302a;
          --popover: #fcfbf6; --foreground: #36302a;
          --muted: #f0efe3; --muted-foreground: #8c8678; --border: #ddd6c6; --input: #ddd6c6;
          --primary: #967e60; --primary-foreground: #ffffff; --primary-hover: #897254;
          --primary-muted: #efece0; --primary-text: #6f5e44; --ring: #967e60; --accent: #eae7da;
          --success: #3f7a34; --success-muted: #e6f5e2; --success-border: #c2e1b3;
          --warning: #93761d; --warning-muted: #fbf4c4; --warning-border: #ebd87f;
          --destructive: #bf4f3b; --destructive-muted: #fbe8e2; --destructive-border: #f0c9ba;
          --info: #3f6fa6; --info-muted: #e6f1fc; --info-border: #bed7ef;
          --hl: rgba(234, 179, 8, 0.42); --hl-active: rgba(202, 138, 4, 0.62);
          --outline: rgba(54, 48, 42, 0.08); --subtle: #a8a294;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--background); color: var(--foreground); font: 13px/1.6 var(--mono); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; height: 100vh; }
      .app { display: grid; grid-template-columns: 248px minmax(0, 1fr) 372px; flex: 1 1 auto; min-height: 0; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 9999px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* ---- Terminus: Button ---- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
        font: 500 13px var(--mono); border-radius: var(--radius-md); padding: 8px 14px; border: 1px solid transparent;
        background: transparent; color: var(--foreground); cursor: pointer; transition: background-color .12s, border-color .12s, color .12s; }
      .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px color-mix(in oklch, var(--ring) 45%, transparent); }
      .btn:disabled { pointer-events: none; opacity: .4; }
      .btn-sm { padding: 6px 10px; font-size: 12px; }
      .btn-block { width: 100%; }
      .btn-solid { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
      .btn-solid:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
      .btn-soft { background: var(--primary-muted); color: var(--primary-text); }
      .btn-soft:hover { background: var(--accent); }
      .btn-surface { background: var(--card); border-color: var(--border); color: var(--foreground); }
      .btn-surface:hover { border-color: var(--primary); }
      .btn-outline { background: transparent; border-color: var(--border); color: var(--foreground); }
      .btn-outline:hover { background: var(--accent); border-color: var(--border); }
      .btn-ghost { background: transparent; color: var(--muted-foreground); }
      .btn-ghost:hover { background: var(--accent); color: var(--foreground); }
      .btn-danger { background: var(--destructive-muted); color: var(--destructive); border-color: var(--destructive-border); }
      .btn-danger:hover { background: color-mix(in oklch, var(--destructive-muted) 70%, var(--destructive)); }

      /* ---- Terminus: Badge ---- */
      .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--radius-md); border: 1px solid transparent;
        font: 500 11px var(--mono); padding: 1px 6px; min-width: 18px; justify-content: center; }
      .badge-warning { background: var(--warning-muted); color: var(--warning); border-color: var(--warning-border); }
      .badge-soft { background: var(--primary-muted); color: var(--primary-text); }

      /* Left: navigation */
      .nav { border-right: 1px solid var(--border); background: var(--card); overflow-y: auto; padding: 18px 14px 40px; }
      .nav .label, .chat .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle); margin: 0 0 12px; padding: 0 6px; }
      .nav a { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); text-decoration: none; padding: 4px 6px; border-radius: 4px; border-left: 2px solid transparent; }
      .nav a span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .nav a:hover { background: var(--accent); color: var(--foreground); }
      .nav a.active { color: var(--foreground); border-left-color: var(--primary); background: var(--accent); }
      .nav a.lvl2 { padding-left: 16px; } .nav a.lvl3 { padding-left: 28px; font-size: 12px; color: var(--subtle); }

      /* Center: plan */
      .main { overflow-y: auto; padding: 28px 44px 120px; position: relative;
        background-image:
          linear-gradient(to right, color-mix(in oklab, var(--foreground) 3%, transparent) 1px, transparent 1px),
          linear-gradient(to bottom, color-mix(in oklab, var(--foreground) 3%, transparent) 1px, transparent 1px);
        background-size: 32px 32px; }
      .main .hint { color: var(--subtle); margin: 0 auto 24px; font-size: 12px; max-width: 760px; }
      .doc { max-width: 760px; margin: 0 auto; }

      /* Revision diff — on a revised plan, show what changed instead of a silent swap. */
      .revbar { display: none; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto 20px;
        padding: 9px 12px; border: 1px solid var(--warning-border); background: var(--warning-muted); border-radius: var(--radius); }
      .revbar.show { display: flex; }
      .revbar .rb-text { color: var(--warning); font: 600 12px var(--mono); }
      .revbar .rb-stat { color: var(--muted-foreground); font-size: 12px; }
      .revbar .rb-actions { margin-left: auto; display: flex; gap: 6px; }
      .diffwrap { display: none; max-width: 760px; margin: 0 auto; }
      .diffwrap.show { display: block; }
      .diffview { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 8px 0; overflow-x: auto; font: 12px/1.55 var(--mono); }
      .diffline { display: flex; white-space: pre; padding: 0 12px; }
      .diffline .g { width: 14px; flex: none; color: var(--subtle); user-select: none; }
      .diffline.ctx { color: var(--muted-foreground); }
      .diffline.add { background: var(--success-muted); color: var(--success); }
      .diffline.add .g { color: var(--success); }
      .diffline.del { background: var(--destructive-muted); color: var(--destructive); }
      .diffline.del .g { color: var(--destructive); }
      .diffline.fold { justify-content: center; color: var(--subtle); font-style: italic; padding: 3px 12px; }
      h1, h2, h3 { line-height: 1.3; margin: 1.5em 0 0.6em; scroll-margin-top: 24px; }
      h1 { font-size: 21px; } h2 { font-size: 16px; } h3 { font-size: 14px; color: var(--muted-foreground); }
      p { margin: 0.6em 0; }
      ul, ol { margin: 0.6em 0; padding-left: 22px; } li { margin: 0.25em 0; }
      a { color: var(--info); }
      code { background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
      pre { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; }
      pre code { background: none; border: none; padding: 0; }
      blockquote { margin: 0.6em 0; padding: 2px 14px; color: var(--muted-foreground); border-left: 3px solid var(--primary); }
      hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
      .blk { border-radius: 4px; padding: 1px 8px; margin: 0 -8px; }
      mark.hl { background: var(--hl); color: inherit; border-radius: 2px; cursor: pointer; padding: 0 1px; }
      mark.hl.active { background: var(--hl-active); box-shadow: 0 0 0 1px var(--warning-border); }

      /* Floating "comment" button (Button surface) + comment Popover */
      /* Step 1: menubar only. Step 2 (.expanded): reveal the input + actions. */
      .popover:not(.expanded) .ta, .popover:not(.expanded) .row { display: none; }
      .popover:not(.expanded) .cats { border-bottom: none; }
      .popover:not(.expanded) .chip:first-child { border-bottom-left-radius: var(--radius); }
      .popover:not(.expanded) .chip:last-child { border-bottom-right-radius: var(--radius); }
      /* Floating annotation toolbar — a menubar of category items over an input. */
      .popover { position: absolute; z-index: 31; display: none; width: 340px; background: var(--popover); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: 0 12px 32px rgba(0,0,0,0.45); padding: 0; }
      .popover .q { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        padding: 6px 10px; margin: 0; background: var(--muted); border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
      /* Menubar strip: category items, evenly split, divider-separated */
      .popover .cats { display: flex; margin: 0; border-bottom: 1px solid var(--border); }
      .chip { flex: 1; font: 500 11px var(--mono); padding: 6px 8px; text-align: center; border: none; border-right: 1px solid var(--border);
        background: transparent; color: var(--muted-foreground); cursor: pointer; transition: background-color .12s, color .12s; }
      .chip:last-child { border-right: none; }
      .chip:hover { background: var(--accent); color: var(--foreground); }
      .chip.active { background: var(--primary-muted); color: var(--primary-text); }
      .popover .row { display: flex; justify-content: flex-end; gap: 8px; align-items: center; padding: 6px 8px; border-top: 1px solid var(--border); }
      .popover .hintk { color: var(--subtle); font-size: 11px; margin-right: auto; }
      /* Caret pointing at the selection (down when the toolbar sits above it) */
      .popover::after { content: ''; position: absolute; left: 18px; width: 9px; height: 9px; background: var(--popover);
        border: 1px solid var(--border); transform: rotate(45deg); display: none; }
      .popover.above::after { display: block; bottom: -5px; border-top: none; border-left: none; }
      .popover.below::after { display: block; top: -5px; background: var(--muted); border-bottom: none; border-right: none; }

      /* ---- Terminus: Textarea ---- */
      .ta { width: 100%; resize: vertical; font: 13px/1.5 var(--mono); color: var(--foreground); background: transparent;
        border: 1px solid var(--input); border-radius: var(--radius-md); padding: 8px 10px; }
      .ta::placeholder { color: var(--subtle); }
      .ta:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 28%, transparent); }
      .popover .ta { min-height: 132px; border: none; border-radius: 0; padding: 8px 10px; } .popover .ta:focus-visible { outline: none; box-shadow: none; }
      .composer .ta { min-height: 52px; }

      /* Right: annotations (Cards) + composer + decisions */
      .chat { border-left: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; }
      .chat .label { padding: 16px 16px 0; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
      .thread { flex: 1; overflow-y: auto; padding: 6px 14px; display: flex; flex-direction: column; gap: 8px; }
      .thread .empty { color: var(--subtle); padding: 8px 4px; }
      /* Terminus: Card */
      .msg { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,0.16); cursor: default; }
      .msg.note { border-color: var(--warning-border); cursor: pointer; }
      .msg.note.active { box-shadow: 0 0 0 2px var(--warning); }
      .msg .meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; align-items: center; }
      .msg .who { color: var(--muted-foreground); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; } .msg.note .who { color: var(--warning); }
      .msg .del { cursor: pointer; border: none; background: none; color: var(--subtle); font-size: 11px; padding: 0 2px; } .msg .del:hover { color: var(--destructive); }
      .msg .quote { color: var(--muted-foreground); font-size: 11px; border-left: 2px solid var(--warning); padding: 1px 8px; margin-bottom: 5px; max-height: 42px; overflow: hidden; }
      .msg .body { white-space: pre-wrap; word-break: break-word; color: var(--card-foreground); }

      /* Terminus: Separator + composer */
      .composer { border-top: 1px solid var(--border); padding: 12px 14px; }
      .actions { padding: 0 14px 14px; }
      .count { color: var(--subtle); font-size: 11px; }

      /* Bottom decision bar — decisions read as the end of the review. Reject sits
         isolated on the left; the two "continue" actions group on the right. The
         summary in the middle says what rides along with the decision. */
      .dbar { flex: none; display: flex; align-items: center; border-top: 1px solid var(--border); background: var(--card); padding: 10px 16px; min-height: 58px; }
      .dbar-live { display: flex; flex: 1; align-items: center; gap: 12px; }
      .dbar-summary { flex: 1; text-align: center; color: var(--subtle); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dbar-group { display: flex; gap: 8px; }

      /* Post-submit confirmation — replaces the decision bar content once a decision
         is sent. Per-decision copy tells you exactly what the agent does next. */
      .sent { display: none; flex: 1; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 14px; }
      .sent.show { display: flex; }
      .sent.approve { border-color: var(--success-border); background: var(--success-muted); }
      .sent.revise  { border-color: var(--warning-border); background: var(--warning-muted); }
      .sent.deny    { border-color: var(--destructive-border); background: var(--destructive-muted); }
      .sent .h { display: flex; align-items: center; gap: 8px; font: 600 13px var(--mono); }
      .sent.approve .h { color: var(--success); }
      .sent.revise  .h { color: var(--warning); }
      .sent.deny    .h { color: var(--destructive); }
      .sent .h { flex: none; }
      .sent .sub { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
      .sent .ico { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
      .sent .again { margin-top: 10px; }
      .dot { width: 7px; height: 7px; border-radius: 9999px; background: currentColor; animation: pulse 1.3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="nav"><p class="label">Contents</p><nav id="toc"></nav></aside>

      <main class="main">
        <p class="hint">Select any text to comment on it. Or chat with the agent on the right. Then decide.</p>
        <div class="revbar" id="revbar">
          <span class="rb-text">Plan revised</span>
          <span class="rb-stat" id="rb-stat"></span>
          <span class="rb-actions">
            <button type="button" class="btn btn-surface btn-sm" id="rb-toggle">View changes</button>
            <button type="button" class="btn btn-ghost btn-sm" id="rb-dismiss">Dismiss</button>
          </span>
        </div>
        <div class="doc" id="plan">Loading plan…</div>
        <div class="diffwrap" id="diffwrap"><div class="diffview" id="diffview"></div></div>
        <div class="popover" id="popover">
          <div class="q" id="pop-quote"></div>
          <div class="cats" id="pop-cats">
            <button type="button" class="chip active" data-cat="Comment">Comment</button>
            <button type="button" class="chip" data-cat="Issue">Issue</button>
            <button type="button" class="chip" data-cat="Question">Question</button>
            <button type="button" class="chip" data-cat="Suggestion">Suggestion</button>
            <button type="button" class="chip" data-cat="Nitpick">Nitpick</button>
          </div>
          <textarea class="ta" id="pop-text" rows="6" placeholder="Your note on this selection…"></textarea>
          <div class="row"><span class="hintk">⌘↵ to save</span>
            <button class="btn btn-ghost btn-sm" id="pop-cancel">Cancel</button>
            <button class="btn btn-solid btn-sm" id="pop-save">Save</button></div>
        </div>
      </main>

      <aside class="chat">
        <p class="label">Review <span class="count" id="count"></span></p>
        <div class="thread" id="thread"><div class="empty">No notes yet. Select text to comment, or send a message.</div></div>
        <div class="composer">
          <textarea class="ta" id="input" placeholder="Message the agent about this plan…"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-soft btn-block" id="send">Send message</button>
        </div>
      </aside>
    </div>

    <!-- Decisions live in a fixed bottom bar — the rail above is purely
         conversational (notes + messages). Reject is isolated on the left. -->
    <footer class="dbar">
      <div class="dbar-live" id="dbar-live">
        <button class="btn btn-danger" data-decision="Reject">Reject</button>
        <span class="dbar-summary" id="dbar-summary"></span>
        <span class="dbar-group">
          <button class="btn btn-outline" data-decision="Request Revisions">Request revisions</button>
          <button class="btn btn-solid" data-decision="Approve">Approve</button>
        </span>
      </div>
      <div class="sent" id="sent">
        <div class="h"><span class="ico" id="sent-ico"></span><span id="sent-title"></span></div>
        <div class="sub" id="sent-sub"></div>
      </div>
    </footer>

    <script>
      // ---- Self-contained Markdown renderer (no external deps) ----
      function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
      function inline(s){return esc(s)
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" rel="noopener noreferrer">$1</a>');}
      function renderBlocks(md){
        const lines=md.replace(/\r\n/g,'\n').split('\n'); const out=[]; let i=0;
        while(i<lines.length){let line=lines[i];
          if(/^```/.test(line)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push({html:'<pre><code>'+esc(buf.join('\n'))+'</code></pre>',heading:null});continue;}
          if(/^\s*$/.test(line)){i++;continue;}
          if(/^#{1,3}\s/.test(line)){const lvl=line.match(/^#+/)[0].length;const text=line.replace(/^#+\s/,'');out.push({html:'<h'+lvl+'>'+inline(text)+'</h'+lvl+'>',heading:{level:lvl,text:text}});i++;continue;}
          if(/^---+\s*$/.test(line)){out.push({html:'<hr>',heading:null});i++;continue;}
          if(/^\s*>/.test(line)){const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));out.push({html:'<blockquote>'+inline(buf.join(' '))+'</blockquote>',heading:null});continue;}
          if(/^\s*([-*+]|\d+\.)\s/.test(line)){const ordered=/^\s*\d+\./.test(line);const buf=[];while(i<lines.length&&/^\s*([-*+]|\d+\.)\s/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*([-*+]|\d+\.)\s/,''))+'</li>');i++;}out.push({html:'<'+(ordered?'ol':'ul')+'>'+buf.join('')+'</'+(ordered?'ol':'ul')+'>',heading:null});continue;}
          const buf=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,3}\s|```|\s*>|\s*([-*+]|\d+\.)\s|---+\s*$)/.test(lines[i]))buf.push(lines[i++]);
          out.push({html:'<p>'+inline(buf.join(' '))+'</p>',heading:null});}
        return out;
      }

      // ---- State ----
      const annotations = []; let nextId = 1;
      const planEl=document.getElementById('plan');
      const tocEl=document.getElementById('toc');
      const pop=document.getElementById('popover');
      const popQuote=document.getElementById('pop-quote');
      const popText=document.getElementById('pop-text');
      const popCats=document.getElementById('pop-cats');
      const main=document.querySelector('.main');
      let pendingRange=null, pendingQuote='', pendingSection='', pendingCat=null, selDoc=null;
      function setCat(cat){ pendingCat=cat; popCats.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.cat===cat);}); }
      // Step 1 shows just the quote + category menubar. Choosing a category expands
      // the toolbar to reveal the note input and action buttons (step 2).
      popCats.querySelectorAll('.chip').forEach(function(c){
        c.onmousedown=function(e){ e.preventDefault(); }; // keep the text selection alive
        c.onclick=function(){ setCat(c.dataset.cat); pop.classList.add('expanded'); placePopover(); popText.focus(); };
      });

      function renderPlan(md){
        planEl.innerHTML=''; tocEl.innerHTML='';
        let section='(top)';
        renderBlocks(md).forEach(function(b,idx){
          const wrap=document.createElement('div'); wrap.className='blk'; wrap.id='blk-'+idx; wrap.innerHTML=b.html;
          if(b.heading){ section='blk-'+idx;
            const a=document.createElement('a'); a.href='#blk-'+idx; a.className='lvl'+b.heading.level; a.dataset.target='blk-'+idx; a.dataset.section='blk-'+idx;
            const t=document.createElement('span'); t.className='t'; t.textContent=b.heading.text; a.appendChild(t);
            const bd=document.createElement('span'); bd.className='badge badge-warning'; bd.style.display='none'; bd.dataset.for='blk-'+idx; a.appendChild(bd);
            a.onclick=function(e){e.preventDefault();document.getElementById('blk-'+idx).scrollIntoView({behavior:'smooth',block:'start'});};
            tocEl.appendChild(a);
          }
          wrap.dataset.section=section; planEl.appendChild(wrap);
        });
        observeHeadings();
      }

      // ---- Selection -> highlight ----
      function blockOf(node){ while(node&&node!==planEl){ if(node.classList&&node.classList.contains('blk')) return node; node=node.parentNode; } return null; }

      // Anchor the toolbar to the stored selection; sits above it, flips below
      // only when the selection is too near the top of the scroll area.
      function placePopover(){
        if(!selDoc) return;
        const pw=pop.offsetWidth, ph=pop.offsetHeight;
        const left=Math.max(4, Math.min(selDoc.left, main.scrollWidth-pw-8));
        let top=selDoc.top-ph-10;
        if(top < main.scrollTop+4){ top=selDoc.bottom+10; pop.classList.add('below'); pop.classList.remove('above'); }
        else { pop.classList.add('above'); pop.classList.remove('below'); }
        pop.style.left=left+'px'; pop.style.top=top+'px';
      }
      function openToolbar(){
        popQuote.textContent='“'+pendingQuote+'”'; popText.value='';
        pendingCat=null; popCats.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');});
        pop.classList.remove('expanded');
        pop.style.display='block'; placePopover();
      }
      // Selecting text in the plan opens the menubar above the selection.
      document.addEventListener('mouseup', function(e){
        if(pop.contains(e.target)) return;
        setTimeout(function(){
          const sel=window.getSelection();
          if(!sel.rangeCount||sel.isCollapsed) return;
          const r=sel.getRangeAt(0);
          if(!planEl.contains(r.commonAncestorContainer)||!sel.toString().trim()) return;
          pendingRange=r.cloneRange(); pendingQuote=sel.toString().trim();
          const blk=blockOf(pendingRange.startContainer); pendingSection=blk?blk.dataset.section:'(top)';
          const rect=pendingRange.getBoundingClientRect(); const host=main.getBoundingClientRect();
          selDoc={ left: rect.left-host.left+main.scrollLeft, top: rect.top-host.top+main.scrollTop, bottom: rect.bottom-host.top+main.scrollTop };
          openToolbar();
        },0);
      });

      function highlight(range, aid){
        const root=range.commonAncestorContainer; const base=root.nodeType===3?root.parentNode:root;
        const walker=document.createTreeWalker(base,NodeFilter.SHOW_TEXT,null); const nodes=[]; let n;
        while(n=walker.nextNode()){ if(range.intersectsNode(n)&&n.nodeValue.trim()!=='') nodes.push(n); }
        nodes.forEach(function(node){
          let s=0,e=node.nodeValue.length;
          if(node===range.startContainer) s=range.startOffset;
          if(node===range.endContainer) e=range.endOffset;
          if(s>=e) return;
          const rng=document.createRange(); rng.setStart(node,s); rng.setEnd(node,e);
          const m=document.createElement('mark'); m.className='hl'; m.dataset.aid=String(aid);
          try{ rng.surroundContents(m); }catch(err){}
        });
      }
      function unhighlight(aid){
        document.querySelectorAll('mark.hl[data-aid="'+aid+'"]').forEach(function(m){
          const p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize();
        });
      }

      function saveNote(){
        const text=popText.value.trim(); if(!text||!pendingRange) { closePop(); return; }
        const id=nextId++;
        try{ highlight(pendingRange,id); }catch(e){}
        annotations.push({id:id,kind:'note',cat:pendingCat,quote:pendingQuote,text:text,section:pendingSection});
        closePop(); window.getSelection().removeAllRanges(); paint();
      }
      function closePop(){ pop.style.display='none'; pop.classList.remove('expanded'); pendingRange=null; }
      document.getElementById('pop-save').onclick=saveNote;
      document.getElementById('pop-cancel').onclick=function(){closePop();window.getSelection().removeAllRanges();};
      popText.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter')saveNote(); if(e.key==='Escape')closePop(); });
      document.addEventListener('mousedown',function(e){ if(!pop.contains(e.target)&&pop.style.display==='block') closePop(); });

      planEl.addEventListener('click',function(e){
        const m=e.target.closest&&e.target.closest('mark.hl'); if(!m) return;
        focusNote(m.dataset.aid,true);
      });
      function focusNote(aid,scroll){
        document.querySelectorAll('mark.hl').forEach(function(x){x.classList.toggle('active',x.dataset.aid===String(aid));});
        document.querySelectorAll('.msg.note').forEach(function(x){x.classList.toggle('active',x.dataset.aid===String(aid));});
        if(scroll){const el=document.querySelector('.msg.note[data-aid="'+aid+'"]'); if(el)el.scrollIntoView({block:'nearest'});}
      }

      function sendChat(){ const ta=document.getElementById('input'); const text=ta.value.trim(); if(!text)return;
        annotations.push({id:nextId++,kind:'chat',quote:'',text:text,section:''}); ta.value=''; paint(); }

      function paint(){
        const box=document.getElementById('thread'); box.innerHTML='';
        document.getElementById('count').textContent=annotations.length?'('+annotations.length+')':'';
        if(!annotations.length){ box.innerHTML='<div class="empty">No notes yet. Select text to comment, or send a message.</div>'; updateBadges(); updateSummary(); return; }
        annotations.forEach(function(a){
          const m=document.createElement('div'); m.className='msg'+(a.kind==='note'?' note':''); if(a.kind==='note')m.dataset.aid=String(a.id);
          const meta=document.createElement('div'); meta.className='meta';
          const who=document.createElement('span'); who.className='who'; who.textContent=a.kind==='note'?(a.cat||'Note'):'message';
          const del=document.createElement('button'); del.className='del'; del.textContent='×';
          del.onclick=function(ev){ev.stopPropagation(); if(a.kind==='note')unhighlight(a.id); const i=annotations.indexOf(a); annotations.splice(i,1); paint();};
          meta.appendChild(who); meta.appendChild(del); m.appendChild(meta);
          if(a.quote){ const q=document.createElement('div'); q.className='quote'; q.textContent='“'+a.quote+'”'; m.appendChild(q); }
          const body=document.createElement('div'); body.className='body'; body.textContent=a.text; m.appendChild(body);
          if(a.kind==='note') m.onclick=function(){ focusNote(a.id,false); const el=document.getElementById(a.section); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); };
          box.appendChild(m);
        });
        updateBadges(); updateSummary();
      }
      // Live summary in the decision bar — what rides along with the decision.
      function updateSummary(){
        const n=annotations.filter(function(a){return a.kind==='note';}).length;
        const m=annotations.filter(function(a){return a.kind==='chat';}).length;
        const parts=[];
        if(n)parts.push(n+' note'+(n>1?'s':'')); if(m)parts.push(m+' message'+(m>1?'s':''));
        document.getElementById('dbar-summary').textContent=
          parts.length?parts.join(' · ')+' will be sent with your decision':'No notes or messages yet — a decision sends on its own';
      }
      function updateBadges(){
        const counts={}; annotations.forEach(function(a){ if(a.kind==='note'&&a.section){counts[a.section]=(counts[a.section]||0)+1;} });
        document.querySelectorAll('.nav .badge').forEach(function(b){ const c=counts[b.dataset.for]||0; b.textContent=c; b.style.display=c?'inline-flex':'none'; });
      }

      let spy;
      function observeHeadings(){ if(spy)spy.disconnect();
        spy=new IntersectionObserver(function(es){es.forEach(function(en){ if(en.isIntersecting){document.querySelectorAll('#toc a').forEach(function(a){a.classList.toggle('active',a.dataset.target===en.target.id);});} });},{root:document.querySelector('.main'),rootMargin:'0px 0px -75% 0px',threshold:0});
        document.querySelectorAll('#toc a').forEach(function(a){const el=document.getElementById(a.dataset.target); if(el)spy.observe(el);});
      }

      // Per-decision confirmation copy — what the agent does with each verdict.
      const SENT={
        'Approve':          {cls:'approve',ico:'✓',wait:false,title:'Approved',sub:'Sent to the agent — it will proceed and implement the plan.'},
        'Request Revisions':{cls:'revise', ico:'',wait:true, title:'Revisions requested',sub:'Your notes are on their way. The agent will revise the plan; the updated version reloads here when it’s ready.'},
        'Reject':           {cls:'deny',   ico:'✕',wait:false,title:'Rejected',sub:'Sent to the agent — it will not implement this. It steps back to reconsider whether the feature should be built at all.'},
      };
      let submitting=false;
      function clearAllNotes(){
        annotations.slice().forEach(function(a){ if(a.kind==='note') unhighlight(a.id); });
        annotations.length=0; nextId=1; paint();
      }
      function showSent(decision){
        const cfg=SENT[decision]||SENT['Request Revisions'];
        document.getElementById('dbar-live').style.display='none';
        const ico=document.getElementById('sent-ico');
        ico.className='ico'+(cfg.wait?' dot':''); ico.textContent=cfg.wait?'':cfg.ico;
        document.getElementById('sent-title').textContent=cfg.title;
        document.getElementById('sent-sub').textContent=cfg.sub;
        document.getElementById('sent').className='sent show '+cfg.cls;
      }
      function resetDecisionUI(){
        document.getElementById('sent').className='sent';
        const a=document.getElementById('dbar-live'); a.style.display='';
        a.querySelectorAll('button').forEach(function(b){b.disabled=false;});
      }
      async function submit(decision){
        if(submitting) return; submitting=true;
        document.querySelectorAll('.dbar button').forEach(function(b){b.disabled=true;});
        try{ await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:decision,thread:annotations})}); }
        catch(e){}
        clearAllNotes();        // notes clear the moment the decision is sent
        showSent(decision);
        submitting=false;
      }
      document.getElementById('send').onclick=sendChat;
      document.getElementById('input').addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter')sendChat();});
      document.querySelectorAll('.dbar button[data-decision]').forEach(function(b){b.onclick=function(){submit(b.dataset.decision);};});

      // ---- Revision diff (self-contained line-level LCS, no deps) ----
      function lineDiff(a,b){
        const A=(a||'').replace(/\r\n/g,'\n').split('\n'), B=(b||'').replace(/\r\n/g,'\n').split('\n');
        const n=A.length,m=B.length; const dp=[]; for(let i=0;i<=n;i++)dp.push(new Int32Array(m+1));
        for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
          dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:(dp[i+1][j]>=dp[i][j+1]?dp[i+1][j]:dp[i][j+1]);
        const out=[]; let i=0,j=0;
        while(i<n&&j<m){ if(A[i]===B[j]){out.push({t:'ctx',s:A[i]});i++;j++;}
          else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:'del',s:A[i]});i++;}
          else{out.push({t:'add',s:B[j]});j++;} }
        while(i<n)out.push({t:'del',s:A[i++]}); while(j<m)out.push({t:'add',s:B[j++]});
        return out;
      }
      function renderDiff(diff){
        const view=document.getElementById('diffview'); view.innerHTML=''; const FOLD=6; let run=[];
        function line(t,s){ const el=document.createElement('div'); el.className='diffline '+t;
          const g=document.createElement('span'); g.className='g'; g.textContent=t==='add'?'+':t==='del'?'-':' ';
          el.appendChild(g); el.appendChild(document.createTextNode(s||' ')); view.appendChild(el); }
        function flush(){ if(!run.length)return;
          if(run.length>FOLD){ line('ctx',run[0].s); line('ctx',run[1].s);
            const f=document.createElement('div'); f.className='diffline fold'; f.textContent='⋯ '+(run.length-4)+' unchanged lines'; view.appendChild(f);
            line('ctx',run[run.length-2].s); line('ctx',run[run.length-1].s); }
          else run.forEach(function(r){line('ctx',r.s);}); run=[]; }
        diff.forEach(function(d){ if(d.t==='ctx')run.push(d); else{ flush(); line(d.t,d.s); } }); flush();
      }
      const diffwrap=document.getElementById('diffwrap');
      function setDiffView(on){
        diffwrap.classList.toggle('show',on);
        planEl.style.display=on?'none':'';
        document.getElementById('rb-toggle').textContent=on?'View rendered':'View changes';
      }
      function showRevBar(diff){
        const adds=diff.filter(function(d){return d.t==='add';}).length;
        const dels=diff.filter(function(d){return d.t==='del';}).length;
        document.getElementById('rb-stat').textContent='+'+adds+' / -'+dels+' lines';
        renderDiff(diff); document.getElementById('revbar').classList.add('show'); setDiffView(false);
      }
      function hideRevBar(){ document.getElementById('revbar').classList.remove('show'); setDiffView(false); }
      document.getElementById('rb-toggle').onclick=function(){ setDiffView(!diffwrap.classList.contains('show')); };
      document.getElementById('rb-dismiss').onclick=hideRevBar;

      let lastPlanMd=null, prevPlanMd=null;
      async function load(){
        const md=await (await fetch('/api/plan')).text();
        if(md===lastPlanMd) return;              // spurious watch event, no content change
        const revised=lastPlanMd!==null;
        if(revised){
          // A revised plan invalidates every anchor. Drop orphaned notes, restore the
          // decision buttons, and diff the old plan against the new one for this round.
          prevPlanMd=lastPlanMd; annotations.length=0; nextId=1; resetDecisionUI();
        }
        lastPlanMd=md;
        renderPlan(md); paint();
        if(revised) showRevBar(lineDiff(prevPlanMd,md)); else hideRevBar();
      }
      try{const es=new EventSource('/api/events');es.onmessage=function(){load();};}catch(e){}
      load();
    </script>
  </body>
</html>
