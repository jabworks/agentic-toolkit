<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>routed fixture — the same nodes, cleanly routed</title>
<style>
  body { margin: 0; }
  text { font-family: sans-serif; font-size: 13px; fill: #1b1f23; }
</style>
</head>
<body>
<svg viewBox="0 0 620 300" style="max-width:100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98" />
    </marker>
  </defs>

  <rect x="10" y="10" width="220" height="280" fill="none" stroke="#8a8f98" stroke-dasharray="4 3" />
  <text x="16" y="24" font-size="11" fill="#6b7280">FRONTEND REPORTING RUNTIME</text>

  <rect x="350" y="10" width="220" height="280" fill="none" stroke="#8a8f98" stroke-dasharray="4 3" />
  <text x="356" y="24" font-size="11" fill="#6b7280">BACKEND REPORTING API</text>

  <g transform="translate(120,40)">
    <rect width="90" height="30" fill="#fff" stroke="#1b1f23" />
    <text x="45" y="19" text-anchor="middle">Catalogs</text>
  </g>

  <g transform="translate(30,110)">
    <rect width="80" height="30" fill="#fff" stroke="#1b1f23" />
    <text x="40" y="19" text-anchor="middle">Planner</text>
  </g>

  <g transform="translate(120,110)">
    <rect width="90" height="30" fill="#fff" stroke="#1b1f23" />
    <text x="45" y="19" text-anchor="middle">Validator</text>
  </g>

  <g transform="translate(120,220)">
    <rect width="90" height="30" fill="#fff" stroke="#1b1f23" />
    <text x="45" y="19" text-anchor="middle">Widget host</text>
  </g>

  <g transform="translate(400,110)">
    <rect width="90" height="30" fill="#fff" stroke="#1b1f23" />
    <text x="45" y="19" text-anchor="middle">Filter API</text>
  </g>

  <g transform="translate(400,220)">
    <rect width="90" height="30" fill="#fff" stroke="#1b1f23" />
    <text x="45" y="19" text-anchor="middle">Query API</text>
  </g>

  <!-- Catalogs -> Widget host, dog-legged through the gutter beside Validator -->
  <path d="M165,70 V95 H114 V205 H165 V220" fill="none" stroke="#8a8f98" marker-end="url(#arrow)" />
  <rect x="90" y="141" width="80" height="16" fill="#fff" />
  <text x="94" y="153" font-size="11">sync write</text>

  <!-- Planner -> Filter API, dog-legged above Catalogs' row through the open middle strip -->
  <path d="M110,125 H100 V90 H405 V125" fill="none" stroke="#8a8f98" marker-end="url(#arrow)" />
  <rect x="230" y="76" width="90" height="16" fill="#fff" />
  <text x="235" y="88" font-size="11">plan query</text>

  <!-- two edges through the open middle strip between the boundaries, each with its own label -->
  <path d="M210,228 H400" fill="none" stroke="#8a8f98" marker-end="url(#arrow)" />
  <rect x="255" y="205" width="90" height="16" fill="#fff" />
  <text x="260" y="217" font-size="11">queue: export.ready</text>

  <path d="M210,236 H400" fill="none" stroke="#8a8f98" marker-end="url(#arrow)" />
  <rect x="255" y="246" width="145" height="16" fill="#fff" />
  <text x="260" y="254" font-size="11">queue: export.failed</text>

  <!-- a short edge below Query API, labeled close by -->
  <line x1="445" y1="250" x2="445" y2="270" stroke="#8a8f98" />
  <rect x="425" y="252" width="70" height="16" fill="#fff" />
  <text x="430" y="260" font-size="11">retry: 3x</text>
</svg>
</body>
</html>
