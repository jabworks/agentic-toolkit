<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>review: {{PLAN_NAME}}</title>
    <!-- Self-contained: no external fonts, scripts, or styles. Zero network egress. -->
    <style>
      :root {
        --background: #111110; --card: #191918; --foreground: #eeeeec;
        --muted: #222221; --muted-foreground: #b5b3ad; --border: #3b3a37;
        --primary: #978365; --accent: #2a2a28; --gold-9: #978365;
        --success: #71d083; --success-muted: #1b2a1e; --success-border: #2d5736;
        --warning: #ffca16; --warning-muted: #302008; --warning-border: #5c3d05;
        --destructive: #ff977d; --destructive-muted: #391714; --destructive-border: #6e2920;
        --info: #70b8ff; --info-muted: #0d2847; --info-border: #104d87;
        --hl: rgba(255, 202, 22, 0.30); --hl-active: rgba(255, 202, 22, 0.55);
        --outline: rgba(237, 237, 236, 0.08); --subtle: #686560;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --background: #fdfdfc; --card: #f9f9f8; --foreground: #21201c;
          --muted: #f1f0ef; --muted-foreground: #63635e; --border: #dad9d6;
          --accent: #e9e8e6;
          --success: #2a7e3b; --success-muted: #e9f6e9; --success-border: #b2ddb5;
          --warning: #ab6400; --warning-muted: #fff7c2; --warning-border: #f3d673;
          --destructive: #d13415; --destructive-muted: #feebe7; --destructive-border: #fdbdaf;
          --info: #0d74ce; --info-muted: #e6f4fe; --info-border: #acd8fc;
          --hl: rgba(255, 202, 22, 0.45); --hl-active: rgba(255, 180, 0, 0.7);
          --outline: rgba(33, 32, 28, 0.08); --subtle: #a09d98;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--background); color: var(--foreground); font: 13px/1.6 var(--mono); font-variant-numeric: tabular-nums; }
      .app { display: grid; grid-template-columns: 248px minmax(0, 1fr) 360px; height: 100vh; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 9999px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* Left: navigation */
      .nav { border-right: 1px solid var(--border); background: var(--card); overflow-y: auto; padding: 18px 14px 40px; }
      .nav .label, .chat .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle); margin: 0 0 12px; padding: 0 6px; }
      .nav a { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); text-decoration: none; padding: 4px 6px; border-radius: 5px; border-left: 2px solid transparent; }
      .nav a span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .nav a:hover { background: var(--accent); color: var(--foreground); }
      .nav a.active { color: var(--foreground); border-left-color: var(--primary); background: var(--accent); }
      .nav a.lvl2 { padding-left: 16px; } .nav a.lvl3 { padding-left: 28px; font-size: 12px; color: var(--subtle); }
      .nav .badge { background: var(--warning-muted); color: var(--warning); border: 1px solid var(--warning-border); border-radius: 999px; font-size: 10px; padding: 0 6px; min-width: 18px; text-align: center; }

      /* Center: plan */
      .main { overflow-y: auto; padding: 28px 44px 120px; position: relative; }
      .main .hint { color: var(--subtle); margin: 0 0 24px; font-size: 12px; }
      .doc { max-width: 760px; }
      h1, h2, h3 { line-height: 1.3; margin: 1.5em 0 0.6em; scroll-margin-top: 24px; }
      h1 { font-size: 21px; } h2 { font-size: 16px; } h3 { font-size: 14px; color: var(--muted-foreground); }
      p { margin: 0.6em 0; }
      ul, ol { margin: 0.6em 0; padding-left: 22px; } li { margin: 0.25em 0; }
      a { color: var(--info); }
      code { background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
      pre { background: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
      pre code { background: none; border: none; padding: 0; }
      blockquote { margin: 0.6em 0; padding: 2px 14px; color: var(--muted-foreground); border-left: 3px solid var(--primary); }
      hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
      .blk { border-radius: 6px; padding: 1px 8px; margin: 0 -8px; }
      mark.hl { background: var(--hl); color: inherit; border-radius: 2px; cursor: pointer; padding: 0 1px; }
      mark.hl.active { background: var(--hl-active); box-shadow: 0 0 0 1px var(--warning-border); }

      /* Floating "comment" button on selection */
      .sel-btn { position: absolute; z-index: 30; display: none; gap: 6px; align-items: center; background: var(--card); color: var(--foreground); border: 1px solid var(--primary); border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); padding: 5px 11px; font: 12px var(--mono); cursor: pointer; }
      /* Inline comment popover anchored at the selection */
      .popover { position: absolute; z-index: 31; display: none; width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); padding: 12px; }
      .popover .q { color: var(--warning); font-size: 11px; max-height: 48px; overflow: auto; border-left: 2px solid var(--warning); padding: 2px 8px; margin-bottom: 8px; }
      .popover textarea { width: 100%; min-height: 60px; resize: vertical; font: 13px/1.5 var(--mono); color: var(--foreground); background: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: 8px; }
      .popover textarea:focus { outline: none; border-color: var(--primary); }
      .popover .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; align-items: center; }
      .popover .hintk { color: var(--subtle); font-size: 11px; margin-right: auto; }

      /* Right: annotations + chat + decision */
      .chat { border-left: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; }
      .chat .label { padding: 16px 16px 0; margin-bottom: 8px; }
      .thread { flex: 1; overflow-y: auto; padding: 6px 14px; display: flex; flex-direction: column; gap: 8px; }
      .thread .empty { color: var(--subtle); padding: 8px 4px; }
      .msg { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--muted); cursor: default; }
      .msg.note { border-color: var(--warning-border); background: var(--warning-muted); cursor: pointer; }
      .msg.note.active { box-shadow: 0 0 0 2px var(--warning); }
      .msg .meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; align-items: center; }
      .msg .who { color: var(--primary); font-size: 11px; } .msg.note .who { color: var(--warning); }
      .msg .del { cursor: pointer; border: none; background: none; color: var(--subtle); font-size: 11px; padding: 0 2px; } .msg .del:hover { color: var(--destructive); }
      .msg .quote { color: var(--muted-foreground); font-size: 11px; border-left: 2px solid var(--warning); padding: 1px 8px; margin-bottom: 4px; max-height: 42px; overflow: hidden; }
      .msg .body { white-space: pre-wrap; word-break: break-word; }

      .composer { border-top: 1px solid var(--border); padding: 10px 14px; }
      .composer textarea { width: 100%; resize: vertical; min-height: 52px; font: 13px/1.5 var(--mono); color: var(--foreground); background: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; }
      .composer textarea:focus { outline: none; border-color: var(--primary); }
      .composer .send { margin-top: 7px; width: 100%; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 14px; }
      .actions .approve-wrap { grid-column: 1 / -1; }
      button { font-family: var(--mono); font-size: 12px; cursor: pointer; border-radius: 7px; padding: 9px 12px; border: 1px solid var(--border); background: var(--muted); color: var(--foreground); }
      button:hover { border-color: var(--primary); }
      button.approve { width: 100%; background: var(--success-muted); border-color: var(--success-border); color: var(--success); }
      button.revise { background: var(--warning-muted); border-color: var(--warning-border); color: var(--warning); }
      button.deny { background: var(--destructive-muted); border-color: var(--destructive-border); color: var(--destructive); }
      button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
      #status { padding: 0 16px 16px; color: var(--success); min-height: 16px; font-size: 12px; }
      .count { color: var(--subtle); font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="nav"><p class="label">Contents</p><nav id="toc"></nav></aside>

      <main class="main">
        <p class="hint">Select any text to comment on it. Or chat with the agent on the right. Then decide.</p>
        <div class="doc" id="plan">Loading plan…</div>
        <div class="sel-btn" id="selbtn">💬 Comment</div>
        <div class="popover" id="popover">
          <div class="q" id="pop-quote"></div>
          <textarea id="pop-text" placeholder="Your note on this selection…"></textarea>
          <div class="row"><span class="hintk">⌘↵ to save</span>
            <button id="pop-cancel">Cancel</button><button class="primary" id="pop-save">Save</button></div>
        </div>
      </main>

      <aside class="chat">
        <p class="label">Review <span class="count" id="count"></span></p>
        <div class="thread" id="thread"><div class="empty">No notes yet. Select text to comment, or send a message.</div></div>
        <div class="composer">
          <textarea id="input" placeholder="Message the agent about this plan…"></textarea>
          <button class="send" id="send">Send message</button>
        </div>
        <div class="actions">
          <div class="approve-wrap"><button class="approve" data-decision="Approve">Approve &amp; proceed</button></div>
          <button class="revise" data-decision="Request Revisions">Request revisions</button>
          <button class="deny" data-decision="Deny">Deny</button>
        </div>
        <div id="status"></div>
      </aside>
    </div>

    <script>
      // ---- Self-contained Markdown renderer (no external deps) ----
      function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
      function inline(s){return esc(s)
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" rel="noopener noreferrer">$1</a>');}
      function renderBlocks(md){
        const lines=md.replace(/\r\n/g,'\n').split('\n'); const out=[]; let i=0;
        while(i<lines.length){let line=lines[i];
          if(/^```/.test(line)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push({html:'<pre><code>'+esc(buf.join('\n'))+'</code></pre>',heading:null});continue;}
          if(/^\s*$/.test(line)){i++;continue;}
          if(/^#{1,3}\s/.test(line)){const lvl=line.match(/^#+/)[0].length;const text=line.replace(/^#+\s/,'');out.push({html:'<h'+lvl+'>'+inline(text)+'</h'+lvl+'>',heading:{level:lvl,text:text}});i++;continue;}
          if(/^---+\s*$/.test(line)){out.push({html:'<hr>',heading:null});i++;continue;}
          if(/^\s*>/.test(line)){const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));out.push({html:'<blockquote>'+inline(buf.join(' '))+'</blockquote>',heading:null});continue;}
          if(/^\s*([-*+]|\d+\.)\s/.test(line)){const ordered=/^\s*\d+\./.test(line);const buf=[];while(i<lines.length&&/^\s*([-*+]|\d+\.)\s/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*([-*+]|\d+\.)\s/,''))+'</li>');i++;}out.push({html:'<'+(ordered?'ol':'ul')+'>'+buf.join('')+'</'+(ordered?'ol':'ul')+'>',heading:null});continue;}
          const buf=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,3}\s|```|\s*>|\s*([-*+]|\d+\.)\s|---+\s*$)/.test(lines[i]))buf.push(lines[i++]);
          out.push({html:'<p>'+inline(buf.join(' '))+'</p>',heading:null});}
        return out;
      }

      // ---- State ----
      const annotations = []; // { id, kind:'note'|'chat', quote, text, section }
      let nextId = 1;
      const planEl=document.getElementById('plan');
      const tocEl=document.getElementById('toc');
      const selBtn=document.getElementById('selbtn');
      const pop=document.getElementById('popover');
      const popQuote=document.getElementById('pop-quote');
      const popText=document.getElementById('pop-text');
      let pendingRange=null, pendingQuote='', pendingSection='';

      function shortHeading(t){return t.length>44?t.slice(0,44)+'…':t;}

      function renderPlan(md){
        planEl.innerHTML=''; tocEl.innerHTML='';
        let section='(top)';
        renderBlocks(md).forEach(function(b,idx){
          const wrap=document.createElement('div'); wrap.className='blk'; wrap.id='blk-'+idx; wrap.innerHTML=b.html;
          if(b.heading){ section='blk-'+idx;
            const a=document.createElement('a'); a.href='#blk-'+idx; a.className='lvl'+b.heading.level; a.dataset.target='blk-'+idx; a.dataset.section='blk-'+idx;
            const t=document.createElement('span'); t.className='t'; t.textContent=b.heading.text; a.appendChild(t);
            const bd=document.createElement('span'); bd.className='badge'; bd.style.display='none'; bd.dataset.for='blk-'+idx; a.appendChild(bd);
            a.onclick=function(e){e.preventDefault();document.getElementById('blk-'+idx).scrollIntoView({behavior:'smooth',block:'start'});};
            tocEl.appendChild(a);
          }
          wrap.dataset.section=section; planEl.appendChild(wrap);
        });
        observeHeadings();
      }

      // ---- Selection -> highlight ----
      function blockOf(node){ while(node&&node!==planEl){ if(node.classList&&node.classList.contains('blk')) return node; node=node.parentNode; } return null; }

      document.addEventListener('selectionchange', function(){
        const sel=window.getSelection();
        if(!sel.rangeCount||sel.isCollapsed){ if(!pop.contains(document.activeElement)) selBtn.style.display='none'; return; }
        const r=sel.getRangeAt(0);
        if(!planEl.contains(r.commonAncestorContainer)||!sel.toString().trim()){ selBtn.style.display='none'; return; }
        const rect=r.getBoundingClientRect(); const host=document.querySelector('.main').getBoundingClientRect();
        selBtn.style.left=(r.endContainer&&rect.right-host.left+document.querySelector('.main').scrollLeft)+'px';
        selBtn.style.top=(rect.bottom-host.top+document.querySelector('.main').scrollTop+8)+'px';
        selBtn.style.display='inline-flex';
      });

      selBtn.onmousedown=function(e){
        e.preventDefault();
        const sel=window.getSelection(); if(!sel.rangeCount) return;
        pendingRange=sel.getRangeAt(0).cloneRange();
        pendingQuote=sel.toString().trim();
        const blk=blockOf(pendingRange.startContainer); pendingSection=blk?blk.dataset.section:'(top)';
        const rect=pendingRange.getBoundingClientRect(); const host=document.querySelector('.main').getBoundingClientRect(); const main=document.querySelector('.main');
        popQuote.textContent='“'+pendingQuote+'”';
        popText.value='';
        pop.style.left=Math.min(rect.left-host.left+main.scrollLeft, main.scrollWidth-340)+'px';
        pop.style.top=(rect.bottom-host.top+main.scrollTop+10)+'px';
        selBtn.style.display='none'; pop.style.display='block'; popText.focus();
      };

      // Wrap every text node intersecting a range in <mark data-aid>.
      function highlight(range, aid){
        const root=range.commonAncestorContainer; const base=root.nodeType===3?root.parentNode:root;
        const walker=document.createTreeWalker(base,NodeFilter.SHOW_TEXT,null); const nodes=[]; let n;
        while(n=walker.nextNode()){ if(range.intersectsNode(n)&&n.nodeValue.trim()!=='') nodes.push(n); }
        nodes.forEach(function(node){
          let s=0,e=node.nodeValue.length;
          if(node===range.startContainer) s=range.startOffset;
          if(node===range.endContainer) e=range.endOffset;
          if(s>=e) return;
          const rng=document.createRange(); rng.setStart(node,s); rng.setEnd(node,e);
          const m=document.createElement('mark'); m.className='hl'; m.dataset.aid=String(aid);
          try{ rng.surroundContents(m); }catch(err){}
        });
      }
      function unhighlight(aid){
        document.querySelectorAll('mark.hl[data-aid="'+aid+'"]').forEach(function(m){
          const p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize();
        });
      }

      function saveNote(){
        const text=popText.value.trim(); if(!text||!pendingRange) { closePop(); return; }
        const id=nextId++;
        try{ highlight(pendingRange,id); }catch(e){}
        annotations.push({id:id,kind:'note',quote:pendingQuote,text:text,section:pendingSection});
        closePop(); window.getSelection().removeAllRanges(); paint();
      }
      function closePop(){ pop.style.display='none'; pendingRange=null; }
      document.getElementById('pop-save').onclick=saveNote;
      document.getElementById('pop-cancel').onclick=function(){closePop();window.getSelection().removeAllRanges();};
      popText.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter')saveNote(); if(e.key==='Escape')closePop(); });
      document.addEventListener('mousedown',function(e){ if(!pop.contains(e.target)&&e.target!==selBtn&&pop.style.display==='block') closePop(); });

      // Click a highlight -> focus its note in the rail
      planEl.addEventListener('click',function(e){
        const m=e.target.closest&&e.target.closest('mark.hl'); if(!m) return;
        focusNote(m.dataset.aid,true);
      });
      function focusNote(aid,scroll){
        document.querySelectorAll('mark.hl').forEach(function(x){x.classList.toggle('active',x.dataset.aid===String(aid));});
        document.querySelectorAll('.msg.note').forEach(function(x){x.classList.toggle('active',x.dataset.aid===String(aid));});
        if(scroll){const el=document.querySelector('.msg.note[data-aid="'+aid+'"]'); if(el)el.scrollIntoView({block:'nearest'});}
      }

      // ---- Chat ----
      function sendChat(){ const ta=document.getElementById('input'); const text=ta.value.trim(); if(!text)return;
        annotations.push({id:nextId++,kind:'chat',quote:'',text:text,section:''}); ta.value=''; paint(); }

      // ---- Right rail + badges ----
      function paint(){
        const box=document.getElementById('thread'); box.innerHTML='';
        document.getElementById('count').textContent=annotations.length?'('+annotations.length+')':'';
        if(!annotations.length){ box.innerHTML='<div class="empty">No notes yet. Select text to comment, or send a message.</div>'; updateBadges(); return; }
        annotations.forEach(function(a){
          const m=document.createElement('div'); m.className='msg'+(a.kind==='note'?' note':''); if(a.kind==='note')m.dataset.aid=String(a.id);
          const meta=document.createElement('div'); meta.className='meta';
          const who=document.createElement('span'); who.className='who'; who.textContent=a.kind==='note'?'📌 note':'message';
          const del=document.createElement('button'); del.className='del'; del.textContent='✕';
          del.onclick=function(ev){ev.stopPropagation(); if(a.kind==='note')unhighlight(a.id); const i=annotations.indexOf(a); annotations.splice(i,1); paint();};
          meta.appendChild(who); meta.appendChild(del); m.appendChild(meta);
          if(a.quote){ const q=document.createElement('div'); q.className='quote'; q.textContent='“'+a.quote+'”'; m.appendChild(q); }
          const body=document.createElement('div'); body.className='body'; body.textContent=a.text; m.appendChild(body);
          if(a.kind==='note') m.onclick=function(){ focusNote(a.id,false); const el=document.getElementById(a.section); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); };
          box.appendChild(m);
        });
        updateBadges();
      }
      function updateBadges(){
        const counts={}; annotations.forEach(function(a){ if(a.kind==='note'&&a.section){counts[a.section]=(counts[a.section]||0)+1;} });
        document.querySelectorAll('.nav .badge').forEach(function(b){ const c=counts[b.dataset.for]||0; b.textContent=c; b.style.display=c?'inline-block':'none'; });
      }

      // Scroll-spy
      let spy;
      function observeHeadings(){ if(spy)spy.disconnect();
        spy=new IntersectionObserver(function(es){es.forEach(function(en){ if(en.isIntersecting){document.querySelectorAll('#toc a').forEach(function(a){a.classList.toggle('active',a.dataset.target===en.target.id);});} });},{root:document.querySelector('.main'),rootMargin:'0px 0px -75% 0px',threshold:0});
        document.querySelectorAll('#toc a').forEach(function(a){const el=document.getElementById(a.dataset.target); if(el)spy.observe(el);});
      }

      async function submit(decision){
        const res=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:decision,thread:annotations})});
        const data=await res.json();
        document.getElementById('status').textContent=decision+' sent — '+(data.file?('written to '+data.file):'returned to the agent')+'.';
      }
      document.getElementById('send').onclick=sendChat;
      document.getElementById('input').addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter')sendChat();});
      document.querySelectorAll('.actions button').forEach(function(b){b.onclick=function(){submit(b.dataset.decision);};});

      async function load(){ renderPlan(await (await fetch('/api/plan')).text()); paint(); }
      try{const es=new EventSource('/api/events');es.onmessage=function(){load();};}catch(e){}
      load();
    </script>
  </body>
</html>
