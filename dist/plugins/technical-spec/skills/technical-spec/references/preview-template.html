<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --background:         #111110;
  --card:               #191918;
  --foreground:         #ededec;
  --muted:              #222221;
  --muted-foreground:   #aba8a1;
  --border:             #3e3e3a;
  --primary:            #978365;
  --primary-foreground: #f2e3c6;
  --secondary:          #222221;
  --accent:             #2a2a28;
  --gold-9:             #978365;
  --success:            #51a55d;
  --info:               #52a9ff;
  --destructive:        #f16a6a;
  --term-bg:   var(--background);
  --term-fg:   var(--foreground);
  --titlebar:  var(--secondary);
  --outline:   rgba(237,237,236,0.08);
  --clay:      var(--primary);
  --dim:       var(--muted-foreground);
  --subtle:    #686560;
  --mono:      'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --radius:    0.75rem;
}

@media (prefers-color-scheme: light) {
  :root {
    --background:         #fdfdfc;
    --card:               #f9f9f8;
    --foreground:         #21201c;
    --muted:              #f1f0ef;
    --muted-foreground:   #82807c;
    --border:             #d5d3cf;
    --primary:            #978365;
    --primary-foreground: #3b2e1e;
    --secondary:          #f1f0ef;
    --accent:             #e9e8e6;
    --gold-9:             #978365;
    --success:            #297c3b;
    --info:               #0d6cbd;
    --destructive:        #ce2c31;
    --outline:  rgba(33,32,28,0.08);
    --subtle:   #a09d98;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font: 13px/1.55 var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--term-fg);
  background: var(--background);
  display: flex;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right,  color-mix(in oklch, var(--foreground) 2%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in oklch, var(--foreground) 2%, transparent) 1px, transparent 1px);
  background-size: 40px 40px;
}

body::after {
  content: '';
  position: fixed;
  top: -240px;
  left: 50%;
  width: 640px;
  height: 640px;
  z-index: 0;
  pointer-events: none;
  transform: translateX(-50%);
  background: radial-gradient(circle, color-mix(in oklch, var(--gold-9) 9%, transparent) 0%, transparent 70%);
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb {
  background-color: var(--primary);
  border-radius: 9999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-track { background: transparent; }

/* ── Sidebar ── */
#sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--muted);
  border-right: 1px solid var(--outline);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  position: relative;
  z-index: 2;
}

.sidebar-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--outline);
}

.sidebar-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--primary);
  padding: 1px 6px;
  background: color-mix(in oklch, var(--primary) 12%, transparent);
  border-radius: 9999px;
  margin-bottom: 6px;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--term-fg);
  line-height: 1.4;
  word-break: break-word;
}

#nav { flex: 1; overflow-y: auto; padding: 4px 0; }

.nav-item {
  display: block;
  padding: 6px 14px;
  cursor: pointer;
  color: var(--dim);
  font-size: 12px;
  border-left: 2px solid transparent;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item::before { content: "  "; white-space: pre; }

.nav-item:hover {
  color: var(--term-fg);
  background: color-mix(in oklch, var(--foreground) 4%, transparent);
}

.nav-item.active {
  color: var(--clay);
  border-left-color: var(--clay);
}

.nav-item.active::before { content: "▸ "; color: var(--clay); }

.sidebar-footer {
  padding: 8px 14px;
  border-top: 1px solid var(--outline);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--subtle);
}

.pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
  animation: blink 2.5s ease-in-out infinite;
}

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Main ── */
#main {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  padding: 40px 24px 80px;
  position: relative;
  z-index: 1;
}

.term {
  max-width: 860px;
  margin: 0 auto;
  background: var(--term-bg);
  border-radius: 12px;
  outline: 1px solid var(--outline);
  box-shadow: 0 20px 60px rgba(20,20,19,0.22);
}

.titlebar {
  background: var(--titlebar);
  border-radius: 12px 12px 0 0;
  border-bottom: 1px solid var(--outline);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.titlebar .tag {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--primary);
  padding: 1px 6px;
  background: color-mix(in oklch, var(--primary) 12%, transparent);
  border-radius: 9999px;
}

.titlebar .path { color: var(--dim); font-size: 11px; }

.term-body { padding: 24px 30px 36px; }

.term-body.fade { animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── Markdown ── */
.term-body h1 {
  all: unset;
  display: block;
  color: var(--clay);
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.term-body h1::before { content: "> "; color: var(--subtle); }

.term-body h2 {
  all: unset;
  display: block;
  color: var(--clay);
  font-weight: 500;
  margin-top: 4px;
  margin-bottom: 8px;
}
.term-body h2::before { content: "▸ "; }

.term-body h3 {
  all: unset;
  display: block;
  color: var(--dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  margin-top: 14px;
  margin-bottom: 6px;
}

.hr {
  color: var(--subtle);
  overflow: hidden;
  white-space: nowrap;
  user-select: none;
  margin-top: 20px;
  margin-bottom: 8px;
}
.hr::after {
  content: "────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────";
}

.meta-block {
  background: var(--card);
  border: 1px solid var(--outline);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 11px;
  color: var(--subtle);
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}
.meta-block strong { color: var(--dim); font-weight: 500; }

.term-body p { margin-bottom: 10px; color: var(--term-fg); line-height: 1.6; }

.term-body ul, .term-body ol { margin-bottom: 10px; padding-left: 20px; color: var(--term-fg); line-height: 1.6; }
.term-body li { margin-bottom: 3px; }
.term-body li::marker { color: var(--subtle); }

.term-body code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--accent);
  border: 1px solid var(--outline);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--primary-foreground);
}

.term-body pre {
  background: var(--card);
  border: 1px solid var(--outline);
  border-radius: 8px;
  padding: 14px;
  overflow-x: auto;
  margin-bottom: 14px;
}

.term-body pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--term-fg);
  font-size: 12px;
  line-height: 1.6;
}

.scroll {
  overflow-x: auto;
  border-top: 1px solid var(--outline);
  border-bottom: 1px solid var(--outline);
  margin-bottom: 14px;
}

.term-body table { width: 100%; border-collapse: collapse; font-size: 12px; }

.term-body th {
  background: var(--term-bg);
  font-weight: 500;
  font-size: 11px;
  color: var(--subtle);
  border-bottom: 1px solid var(--outline);
  padding: 6px 10px;
  text-align: left;
  white-space: nowrap;
}

.term-body td {
  border-top: 1px solid color-mix(in oklch, var(--foreground) 4%, transparent);
  padding: 6px 10px;
  color: var(--term-fg);
  vertical-align: top;
}

.term-body tbody tr:hover td {
  background: color-mix(in oklch, var(--foreground) 2%, transparent);
}

.term-body blockquote {
  border-left: 2px solid var(--clay);
  margin: 0 0 12px;
  padding: 2px 14px;
  color: var(--dim);
}

.term-body a { color: var(--info); text-decoration: none; }
.term-body a:hover { text-decoration: underline; }
.term-body hr { border: none; border-top: 1px solid var(--outline); margin: 20px 0; }
.term-body strong { color: var(--primary-foreground); }

.diagram-wrap {
  background: var(--card);
  border: 1px solid var(--outline);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 14px;
  text-align: center;
  overflow-x: auto;
}
.diagram-wrap svg { max-width: 100%; height: auto; }
.diagram-error { color: var(--subtle); font-size: 12px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-tag">spec</div>
    <div class="sidebar-title" id="sidebar-title">loading...</div>
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-footer">
    <div class="pulse" id="pulse"></div>
    <span>live preview</span>
  </div>
</aside>

<main id="main">
  <div class="term">
    <div class="titlebar">
      <span class="tag">tech-spec</span>
      <span class="path" id="file-path">index.md</span>
    </div>
    <div class="term-body" id="content"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3/lib/viz-standalone.js"></script>
<script>
var vizInstance = null;
var currentFile = null;
var pendingDiagrams = false;

var FILE_LABELS = {
  'index.md':          'overview',
  'decisions.md':      'decisions',
  'api.md':            'api',
  'implementation.md': 'implementation',
  'quirks.md':         'quirks'
};

Viz.instance().then(function(v) {
  vizInstance = v;
  if (pendingDiagrams) { renderPendingDiagrams(); pendingDiagrams = false; }
});

function fileLabel(name) {
  return FILE_LABELS[name] || name.replace('.md', '');
}

function renderPendingDiagrams() {
  if (!vizInstance) return;
  document.querySelectorAll('.diagram-placeholder').forEach(function(el) {
    var src = decodeURIComponent(el.getAttribute('data-src'));
    try {
      var svg = vizInstance.renderSVGElement(src);
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      var wrap = document.createElement('div');
      wrap.className = 'diagram-wrap';
      wrap.appendChild(svg);
      el.parentNode.replaceChild(wrap, el);
    } catch (e) {
      el.innerHTML = '<span class="diagram-error">diagram error: ' + e.message + '</span>';
    }
  });
}

function processMarkdown(raw) {
  var container = document.createElement('div');
  container.innerHTML = marked.parse(raw);

  // .hr dividers before every h2 (matches Terminus template convention)
  container.querySelectorAll('h2').forEach(function(h2) {
    var hr = document.createElement('div');
    hr.className = 'hr';
    h2.parentNode.insertBefore(hr, h2);
  });

  // horizontal-scroll wrapper for tables
  container.querySelectorAll('table').forEach(function(table) {
    var wrap = document.createElement('div');
    wrap.className = 'scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });

  // meta-block styling for the preamble (Last updated / Commit / Status)
  var paras = container.querySelectorAll('p');
  for (var i = 0; i < paras.length; i++) {
    var p = paras[i];
    if (p.innerHTML.indexOf('<strong>') !== -1 &&
       (p.innerHTML.indexOf('Last updated') !== -1 || p.innerHTML.indexOf('Commit') !== -1)) {
      p.className = 'meta-block';
      break;
    }
  }

  // dot diagrams
  container.querySelectorAll('code.language-dot').forEach(function(code) {
    var src = code.textContent;
    var pre = code.closest('pre');
    if (!pre) return;
    var replacement = document.createElement('div');
    if (vizInstance) {
      try {
        var svg = vizInstance.renderSVGElement(src);
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        replacement.className = 'diagram-wrap';
        replacement.appendChild(svg);
      } catch (e) {
        replacement.className = 'diagram-wrap';
        replacement.innerHTML = '<span class="diagram-error">diagram error: ' + e.message + '</span>';
      }
    } else {
      replacement.className = 'diagram-placeholder diagram-wrap';
      replacement.setAttribute('data-src', encodeURIComponent(src));
      replacement.innerHTML = '<span class="diagram-error">rendering diagram...</span>';
      pendingDiagrams = true;
    }
    pre.parentNode.replaceChild(replacement, pre);
  });

  return container.innerHTML;
}

function renderFile(name) {
  currentFile = name;
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-file') === name);
  });
  document.getElementById('file-path').textContent = name;
  fetch('/api/file/' + encodeURIComponent(name))
    .then(function(r) { return r.text(); })
    .then(function(raw) {
      var html = processMarkdown(raw);
      var el = document.getElementById('content');
      el.classList.remove('fade');
      void el.offsetWidth;
      el.classList.add('fade');
      el.innerHTML = html;
    });
}

function buildNav(files) {
  var nav = document.getElementById('nav');
  nav.innerHTML = '';
  files.forEach(function(file) {
    var item = document.createElement('div');
    item.className = 'nav-item' + (file === currentFile ? ' active' : '');
    item.setAttribute('data-file', file);
    item.textContent = fileLabel(file);
    item.addEventListener('click', function() { renderFile(file); });
    nav.appendChild(item);
  });
}

function updateTitle(files) {
  if (files.indexOf('index.md') === -1) return;
  fetch('/api/file/index.md')
    .then(function(r) { return r.text(); })
    .then(function(raw) {
      var m = raw.match(/^#\s+(.+?)(?:\s+[-—].+)?$/m);
      if (m) {
        document.getElementById('sidebar-title').textContent = m[1].trim().toLowerCase();
        document.title = m[1].trim() + ' — spec';
      }
    });
}

function refresh() {
  fetch('/api/files')
    .then(function(r) { return r.json(); })
    .then(function(files) {
      buildNav(files);
      updateTitle(files);
      if (!currentFile && files.length) {
        renderFile(files[0]);
      } else if (currentFile) {
        renderFile(currentFile);
      }
    });
}

var es = new EventSource('/api/events');
es.onmessage = refresh;
es.onerror = function() { document.getElementById('pulse').style.background = 'var(--destructive)'; };

refresh();
</script>
</body>
</html>
