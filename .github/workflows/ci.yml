name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # npm-channel.test.mjs walks back to the last @jabworks/condux release
          # commit to see whether the published surface drifted since. The
          # default shallow checkout cannot reach it, and that test fails rather
          # than skips — a guard that vanishes with its history is no guard.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Syntax-check reference scripts
        run: find skills -name '*.js' -print0 | xargs -0 -n1 node --check
      # Dependency-free, so it runs before install and fails fast on the class
      # of break that shipped four times (see the incident ledger). The strict
      # YAML oracle in the test suite backs it up once deps are in.
      - name: Check SKILL.md frontmatter
        run: node scripts/check-frontmatter.mjs
      # The suite now needs the `yaml` devDependency. tests/frontmatter-yaml.test.mjs
      # FAILS rather than skips when it is absent — a guard that vanishes with its
      # tool is how the 2026-08-05 break reached users.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test suite
        # Force the spec reporter: off-TTY the default is tap, and the summary
        # step below parses spec's "ℹ tests / ✖" lines.
        run: |
          set -o pipefail
          node --test --test-reporter=spec --test-reporter-destination=stdout 2>&1 | tee test-output.txt
      - name: Write test summary
        if: always()
        run: |
          {
            echo "## Test suite"
            echo ""
            grep -E '^ℹ (tests|pass|fail|skipped|duration_ms) ' test-output.txt | sed 's/^ℹ /- **/; s/ \([0-9.]*\)$/**: \1/' || echo "_no test output captured_"
            if grep -q '^✖ failing tests:' test-output.txt; then
              echo ""
              echo "### Failing"
              grep -E '^✖ .+\(.+ms\)$' test-output.txt | sed 's/^✖ /- ❌ /' | sort -u
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publish-surface dry-run (claude-sdlc-wizard pattern): catch release
  # regressions at PR time, not tag time. Enforcing since 2026-08-05 — it ran
  # advisory long enough to prove headless-stable on runners.
  #
  # Scope note: this job validates plugin.json and the publish surface. It is NOT
  # a frontmatter oracle — `claude plugin validate` passed the file that broke
  # Codex on 2026-08-05, because Claude's own frontmatter parser is lenient. The
  # frontmatter guards live in the test job above; do not conflate the two.
  # Keep node-version in parity with that job.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # This job installs no project deps — the pnpm cache lookup would fail.
          package-manager-cache: false
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate publish surface
        run: bash scripts/validate-plugins.sh
