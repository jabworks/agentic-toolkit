name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check reference scripts
        run: find skills -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run test suite
        run: node --test
