/* :where() keeps these at zero specificity, so a surface overrides them by

      .nav .tree-filter input { width: 100%; font: inherit; font-size: var(--text-sm); color: var(--foreground); background: var(--background);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px; outline: none; }
      .nav .tree-filter input:focus { border-color: var(--ring); }
      .nav a.folder { font-weight: 600; color: var(--muted-foreground); }
      .nav a.folder .arrow { flex: none; width: 12px; color: var(--subtle); font-size: var(--text-2xs); }
      .crumbs { display: none; max-width: 720px; margin: 0 auto 18px; font: var(--text-xs) var(--mono); color: var(--subtle);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .crumbs .seg { color: var(--muted-foreground); }
      .crumbs a.seg { color: var(--muted-foreground); text-decoration: none; cursor: pointer; }
      .crumbs a.seg:hover { color: var(--foreground); text-decoration: underline; }
      .crumbs .sep { margin: 0 6px; color: var(--subtle); }
      .crumbs .cur { color: var(--foreground); }
      .pnav { display: none; max-width: 720px; margin: 32px auto 0; padding-top: 14px; border-top: 1px solid var(--border);
        justify-content: space-between; gap: 12px; }
      .pnav a { display: inline-flex; align-items: center; gap: 6px; max-width: 48%; color: var(--muted-foreground);
        text-decoration: none; font-size: var(--text-sm); padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pnav a:hover { background: var(--accent); color: var(--foreground); }
      .pnav .spacer { flex: 1; }

      /* Center: plan. `position: relative` and `overflow-y: auto` are load-bearing
         and must both stay: #popover is absolutely positioned against this box,
         and selDoc stores coordinates relative to it plus its scrollTop. Moving
         the scroll to body, or wrapping #plan in its own scroller, silently
         breaks every annotation anchor. */
      .main { overflow-y: auto; padding: 40px 44px 140px; position: relative; }
      .main .hint { color: var(--subtle); margin: 0 auto 24px; font-size: var(--text-xs); max-width: 720px; }
      .doc { max-width: 720px; margin: 0 auto; line-height: var(--leading-relaxed); counter-reset: hl; }

      /* Revision diff — on a revised plan, show what changed instead of a silent swap. */
      .revbar { display: none; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto 20px;
        padding: 9px 12px; border: 1px solid var(--warning-border); background: var(--warning-muted); border-radius: var(--radius); }
      .revbar.show { display: flex; }
      .revbar .rb-text { color: var(--warning); font: 600 var(--text-xs) var(--sans); }
      .revbar .rb-stat { color: var(--muted-foreground); font-size: var(--text-xs); }
      .revbar .rb-actions { margin-left: auto; display: flex; gap: 6px; }
      .diffwrap { display: none; max-width: 720px; margin: 0 auto; }
      .diffwrap.show { display: block; }
      .diffview { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 8px 0; overflow-x: auto; font: var(--text-xs)/var(--leading-normal) var(--mono); }
      .diffline { display: flex; white-space: pre; padding: 0 12px; }
      .diffline .g { width: 14px; flex: none; color: var(--subtle); user-select: none; }
      .diffline.ctx { color: var(--muted-foreground); }
      .diffline.add { background: var(--success-muted); color: var(--success); }
      .diffline.add .g { color: var(--success); }
      .diffline.del { background: var(--destructive-muted); color: var(--destructive); }
      .diffline.del .g { color: var(--destructive); }
      .diffline.fold { justify-content: center; color: var(--subtle); font-style: italic; padding: 3px 12px; }
      /* D10 — a typographic spine. Hierarchy is space and rule, not boxes: h1
         closes with a rule, h2 opens a section against a hairline, h3 hangs off
         a short dash. This is what makes a long plan skimmable without folding
         it — folds are ruled out on this surface (live Ranges and mark.hl nodes
         have no client rects inside a collapsed <details>). */
      h1, h2, h3, h4, h5, h6 { line-height: var(--leading-snug); margin: 1.5em 0 0.6em; scroll-margin-top: 24px; }
      h1 { font-size: var(--text-2xl); letter-spacing: -0.015em; margin: 0 0 0.2em; padding-bottom: 0.5em; border-bottom: 1px solid var(--border); }
      h2 { font-size: var(--text-lg); letter-spacing: -0.01em; margin: 2.4em 0 0.7em; padding-top: 0.9em; border-top: 1px solid var(--border); }
      h3 { font-size: var(--text-base); color: var(--foreground); margin: 1.9em 0 0.5em; }
      h3::before { content: ''; display: inline-block; width: 14px; height: 1px; vertical-align: middle; margin-right: 10px; background: var(--subtle); }
      h4 { font-size: var(--text-sm); } h5, h6 { font-size: var(--text-xs); color: var(--muted-foreground); }
      .doc > *:first-child, .docpane > *:first-child { margin-top: 0; }
      p { margin: 0.6em 0; }
      ul, ol { margin: 0.6em 0; padding-left: 22px; } li { margin: 0.25em 0; }
      /* Q15 — capping measure on <p> alone misses the worst line, and a plan is
         mostly list items. Table cells keep their column. */
      .doc p, .doc li { max-width: 68ch; }
      .doc td p, .doc td li, .doc th p { max-width: none; }
      li.task { list-style: none; margin-left: -18px; }
      del { color: var(--subtle); }
      a { color: var(--info); }
      code { background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: var(--text-xs); }
      pre { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-family: var(--mono); }
      pre code { background: none; border: none; padding: 0; }
      blockquote { margin: 0.6em 0; padding: 2px 14px; color: var(--muted-foreground); border-left: 3px solid var(--primary); }
      hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
      /* D10 — h2 now opens a section against its own rule, which makes a
         preceding `---` a second divider saying the same thing. draft-plan's
         canonical template puts `---` immediately before every task card, so
         this is the shape of nearly every plan this surface renders: measured
         9 doubled rules in one 9-task plan. Each block is wrapped in its own
         .blk, so `hr + h2` cannot match — the relative selector looks forward
         to the next block instead. The h2's rule is the spine and stays; the
         redundant separator goes. */
      .blk:has(> hr):has(+ .blk h2) { display: none; }
      table { border-collapse: collapse; margin: 0.9em 0; width: 100%; display: block; overflow-x: auto; font-size: var(--text-sm); }
      th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
      th { background: var(--muted); font-weight: 600; }
      tbody tr:nth-child(even) { background: color-mix(in oklch, var(--muted) 40%, transparent); }
      .blk { border-radius: 4px; padding: 1px 8px; margin: 0 -8px; }
      /* D10 — numbered marginalia. The counter increments per highlight in
         document order and the review column repeats the same ordinal in its
         gutter, so the two columns read as one artifact. paint() orders the
         thread by document position to keep the two numberings in agreement —
         without that they diverge the moment a note is added above an earlier
         one. The counter is also the only trace of an annotation on paper, since
         the review column is print-suppressed. */
      mark.hl { background: var(--hl); color: inherit; border-radius: 2px; cursor: pointer; padding: 0.1em 1px;
        box-decoration-break: clone; -webkit-box-decoration-break: clone; counter-increment: hl; }
      mark.hl::after { content: counter(hl); font: 600 var(--text-2xs) var(--mono); color: var(--muted-foreground);
        vertical-align: super; margin-left: 2px; line-height: 0; }
      mark.hl:hover { background: var(--hl-active); }
      mark.hl.active { background: var(--hl-active); box-shadow: 0 0 0 1px var(--warning-border); }

      /* Floating "comment" button (Button surface) + comment Popover */
      /* Step 1: menubar only. Step 2 (.expanded): reveal the input + actions. */
      .popover:not(.expanded) .ta, .popover:not(.expanded) .row { display: none; }
      .popover:not(.expanded) .cats { border-bottom: none; }
      .popover:not(.expanded) .chip:first-child { border-bottom-left-radius: var(--radius); }
      .popover:not(.expanded) .chip:last-child { border-bottom-right-radius: var(--radius); }
      /* Floating annotation toolbar — a menubar of category items over an input. */
      .popover { position: absolute; z-index: 31; display: none; width: 340px; background: var(--popover); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 0; }
      .popover .q { color: var(--muted-foreground); font-size: var(--text-2xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        padding: 6px 10px; margin: 0; background: var(--muted); border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
      /* Menubar strip: category items, evenly split, divider-separated */
      .popover .cats { display: flex; margin: 0; border-bottom: 1px solid var(--border); }
      .chip { flex: 1; font: 500 var(--text-2xs) var(--sans); padding: 6px 8px; text-align: center; border: none; border-right: 1px solid var(--border);
        background: transparent; color: var(--muted-foreground); cursor: pointer; transition: background-color .12s, color .12s; }
      .chip:last-child { border-right: none; }
      .chip:hover { background: var(--accent); color: var(--foreground); }
      .chip.active { background: var(--primary-muted); color: var(--primary-text); }
      .popover .row { display: flex; justify-content: flex-end; gap: 8px; align-items: center; padding: 6px 8px; border-top: 1px solid var(--border); }
      .popover .hintk { color: var(--subtle); font-size: var(--text-2xs); margin-right: auto; }
      /* Caret pointing at the selection (down when the toolbar sits above it) */
      .popover::after { content: ''; position: absolute; left: 18px; width: 9px; height: 9px; background: var(--popover);
        border: 1px solid var(--border); transform: rotate(45deg); display: none; }
      .popover.above::after { display: block; bottom: -5px; border-top: none; border-left: none; }
      .popover.below::after { display: block; top: -5px; background: var(--muted); border-bottom: none; border-right: none; }

      /* ---- Terminus: Textarea ---- */
      .ta { width: 100%; resize: vertical; font: var(--text-sm)/var(--leading-normal) var(--sans); color: var(--foreground); background: transparent;
        border: 1px solid var(--input); border-radius: var(--radius); padding: 8px 10px; }
      .ta::placeholder { color: var(--subtle); }
      .ta:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 28%, transparent); }
      .popover .ta { min-height: 132px; border: none; border-radius: 0; padding: 8px 10px; } .popover .ta:focus-visible { outline: none; box-shadow: none; }
      .composer .ta { min-height: 52px; }

      /* Right: annotations as marginalia + composer + decisions.
         D10 — the review column recedes so the document can lead. Notes lose
         their card chrome and are separated by rule alone, each keyed by the
         same ordinal its highlight carries in the document. */
      .chat { border-left: 1px solid var(--border); background: var(--background); display: flex; flex-direction: column; }
      .chat .label { padding: 22px 18px 0; margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
        font: 600 var(--text-2xs) var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--subtle); }
      .thread { flex: 1; overflow-y: auto; padding: 10px 18px; display: flex; flex-direction: column; gap: 0; counter-reset: note; }
      .thread .empty { color: var(--subtle); padding: 8px 4px; }
      .msg { position: relative; background: transparent; border: none; border-top: 1px solid var(--border);
        border-left: 2px solid transparent; border-radius: 0; padding: 14px 0 14px 26px; box-shadow: none; cursor: default; }
      .msg:first-child { border-top: none; }
      .msg::before { counter-increment: note; content: counter(note); position: absolute; left: 8px; top: 15px;
        font: 600 var(--text-2xs) var(--mono); color: var(--subtle); }
      /* A note on another document takes no ordinal — see paint(). The marker
         says "annotated, elsewhere" without claiming a position in a sequence
         the reader cannot see. */
      .msg[data-other-doc]::before { counter-increment: none; content: '·'; }
      .msg.note { cursor: pointer; }
      .msg.note.active { background: var(--accent); }
      .msg .meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; align-items: center; }
      .msg .who { color: var(--muted-foreground); font: 600 var(--text-2xs) var(--sans); text-transform: uppercase; letter-spacing: .07em; }
      .msg .del { cursor: pointer; border: none; background: none; color: var(--subtle); font-size: var(--text-2xs); padding: 0 2px; } .msg .del:hover { color: var(--destructive); }
      .msg .quote { color: var(--muted-foreground); font-size: var(--text-2xs); font-style: italic; border-left: 2px solid var(--hl-active); padding: 1px 9px; margin-bottom: 6px; max-height: 42px; overflow: hidden; }
      .msg .body { white-space: pre-wrap; word-break: break-word; color: var(--foreground); }

      /* Category as colour, carried by the two marks already in the gutter — the
         ordinal and the label — rather than by a card edge. Lets you count the
         issues in a full thread without reading it. `data-cat` is set in paint();
         the category is otherwise only written as TEXT into .who, and CSS cannot
         select on text content. */
      /* The five categories are exactly the popover's chips — Comment, Issue,
         Question, Suggestion, Nitpick — plus "Note", which is what a note gets
         when no chip was clicked (openToolbar clears pendingCat on every open,
         so the markup's initial `active` chip is not a default). Comment and
         Note are deliberately quiet: they are the common case, and colouring
         them would leave nothing for the categories that carry a decision. */
      .msg[data-cat="Issue"] { border-left-color: var(--destructive); }
      .msg[data-cat="Issue"]::before, .msg[data-cat="Issue"] .who { color: var(--destructive); }
      .msg[data-cat="Question"] { border-left-color: var(--warning); }
      .msg[data-cat="Question"]::before, .msg[data-cat="Question"] .who { color: var(--warning); }
      .msg[data-cat="Suggestion"] { border-left-color: var(--primary); }
      .msg[data-cat="Suggestion"]::before, .msg[data-cat="Suggestion"] .who { color: var(--primary-text); }
      .msg[data-cat="Nitpick"] { border-left-color: var(--subtle); }
      .msg[data-cat="Nitpick"]::before, .msg[data-cat="Nitpick"] .who { color: var(--subtle); }

      /* Terminus: Separator + composer */
      .composer { border-top: 1px solid var(--border); padding: 12px 14px; }
      .actions { padding: 0 14px 14px; }
      .count { color: var(--subtle); font-family: var(--mono); font-size: var(--text-2xs); }

      /* Bottom decision bar — decisions read as the end of the review. Reject sits
         isolated on the left; the two "continue" actions group on the right. The
         summary in the middle says what rides along with the decision. */
      .dbar { flex: none; display: flex; align-items: center; border-top: 1px solid var(--border); background: var(--card); padding: 10px 16px; min-height: 58px; }
      .dbar-live { display: flex; flex: 1; align-items: center; gap: 12px; }
      .dbar-summary { flex: 1; text-align: center; color: var(--subtle); font-size: var(--text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dbar-group { display: flex; gap: 8px; }

      /* Post-submit confirmation — replaces the decision bar content once a decision
         is sent. Per-decision copy tells you exactly what the agent does next. */
      .sent { display: none; flex: 1; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 14px; }
      .sent.show { display: flex; }
      .sent.approve { border-color: var(--success-border); background: var(--success-muted); }
      .sent.revise  { border-color: var(--warning-border); background: var(--warning-muted); }
      .sent.deny    { border-color: var(--destructive-border); background: var(--destructive-muted); }
      .sent .h { display: flex; align-items: center; gap: 8px; font: 600 var(--text-sm) var(--sans); }
      .sent.approve .h { color: var(--success); }
      .sent.revise  .h { color: var(--warning); }
      .sent.deny    .h { color: var(--destructive); }
      .sent .h { flex: none; }
      .sent .sub { color: var(--muted-foreground); font-size: var(--text-xs); line-height: var(--leading-normal); }
      .sent .ico { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
      .sent .again { margin-top: 10px; }
      .dot { width: 7px; height: 7px; border-radius: 9999px; background: currentColor; animation: pulse 1.3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

      /* Docket #50 — the shell has to COLLAPSE for print, not just hide its
         chrome. The kit's print block sets [data-kit-chrome] { display: none },
         which hides .nav and .chat but leaves their grid TRACKS on .app, so
         .main auto-placed into the first (248px) track and the plan printed in a
         ~151px column. .main is also the scroll container, so printed output was
         clipped to the one screenful scrolled into view — the rest of the plan
         did not print at all.
         The measure cap stays: prose set to the full page width is no more
         readable on paper than on screen. Only the centring margin goes, so the
         column sits against the page's own margin. */
      @media print {
        .app { display: block; }
        .main { overflow: visible; padding: 0; height: auto; }
        .doc, .crumbs { margin: 0; }
      }
    </style>

      (function () {
        const PLAN = "# Plan: session-report surface redesign (surface-kit D6 step 2, surface 3)\n\n> Date: 2026-08-22\n> Design: `.condux/designs/2026-08-22-session-report-surface.md` (✅ signed off)\n> Specimen: `.condux/designs/2026-08-22-session-report-surface/direction-c2-cockpit-revised.html`\n\n## Overview\n\n**Goal:** Land Direction C (Cockpit, revised) on `skills/session-report/template.html` —\na sticky anomaly strip, a comparison rail, collapsible sections, one added and one\ntrimmed section — and close docket #48 on the two surfaces this PR owns.\n\n**Approach:** The shipped render JS addresses every container by id, so the layout\nmoves freely; what it does *not* tolerate is a missing container (C7), a collapsed\nnav target (C8), or a collapsed section at print time (C9). Tasks 1–3 split the work\nby layer (CSS → markup → render JS) because each layer has a distinct failure mode\nand a distinct verification. Everything after Task 3 is propagation and bookkeeping.\n\n**Tech / conventions:** No egress — self-contained HTML, no CDN, no webfonts.\nEdit `skills/`, never `dist/`; `bash scripts/sync.sh session-report` and\n`bash scripts/sync.sh record` propagate. `node --test` gates the build.\nCommit with `-s`, no `Co-Authored-By`.\n\n## Global Constraints\n\nCopied verbatim from the design — these are measured, not assumed:\n\n- **C1** — sections must stay descendants of `.term-body` (three call sites:\n  `:1894`, `:1924`, `:2423`). `#secnav` is addressed by id and may move anywhere.\n- **C2** — every navigable section needs an `h2` whose **first child node** is the\n  label text (`<span class=\"hint\">` must stay a later sibling inside the `h2`).\n- **C3** — `sec.id` is auto-derived from the h2 label when absent; renaming a\n  heading silently changes its deep-link anchor.\n- **C4** — `.more-btn` uses `previousElementSibling`; drill lists keep strict\n  `[list][button]` order. Do not wrap the list.\n- **C5** — `.kit-theme`'s parent must tolerate a `.kit-controls` wrapper inserted\n  at runtime.\n- **C6** — `#hero` must survive with a usable `afterend` slot for the empty states.\n- **C7** — the render is **not null-guarded**; a removed container throws and kills\n  every later render step.\n- **C8** — a collapsed `<details>` breaks nav and deep links.\n- **C9** — a collapsed `<details>` prints nothing.\n- **Q13** — `data-kit-chrome` **is** print suppression. Only the rail's nav block\n  carries it; the strip and the comparison blocks must print.\n- Never hand-edit `dist/`. Never hand-edit `marketplace.json` or the doc catalogs.\n\n## Files Affected\n\n- `skills/session-report/template.html` — the surface: CSS, markup, render JS\n- `skills/session-report/SKILL.md` — agent fill instructions for `findings` and\n  `recommendations`\n- `skills/record/server/board-shell.html` — docket #48 fix only (orphaned instance)\n- `tests/session-report-surface.test.mjs` — **new**, mirrors\n  `session-handoff-surface.test.mjs`\n- `dist/plugins/session-report/.claude-plugin/plugin.json` + `.codex-plugin/` — 1.10.0 → 1.11.0\n- `dist/plugins/docket/.claude-plugin/plugin.json` + `.codex-plugin/` — 0.10.1 → 0.10.2\n- `specs/surface-kit/implementation.md` — stale line counts + the ratified order flip\n- `specs/surface-kit/index.md` — D9 changelog entry\n- `specs/surface-kit/audit.md` — F6/F9 status for session-report\n- `specs/surface-kit/session-report-direction-c.html` — **new**, promoted specimen\n- `docket/DOCKET.md` — #48 status update (two of three surfaces done)\n- Dist mirrors (generated): `dist/plugins/session-report/`, `dist/opencode/skills/session-report/`,\n  `dist/cursor/skills/session-report/`, `dist/plugins/docket/`\n\n## Task Checklist\n\n- [ ] Task 1: Surface CSS — strip, rail, folds, #48, F6/F9\n- [ ] Task 2: Markup restructure — strip, rail, folds, section set\n- [ ] Task 3: Render JS — rail data, comparison table, reveal, print\n- [ ] Task 4: SKILL.md fill instructions\n- [ ] Task 5: docket #48 on board-shell.html\n- [ ] Task 6: tests/session-report-surface.test.mjs\n- [ ] Task 7: Version bumps and changelogs\n- [ ] Task 8: Spec updates, specimen promotion, docket note\n- [ ] Task 9: Sync, full verify, live-verify\n\n---\n\n## Task 1: Surface CSS — strip, rail, folds, #48, F6/F9\n\n**What:** Rewrite the surface's own CSS (everything between `/* kit:css:end */` and\n`</style>`) for the Cockpit layout: a sticky solid `.strip`, a 17rem sticky `.rail`\ninside a `.shell` grid, fold styling on `<details>`, and the `project comparison`\ntable. In the same pass close two open audit findings — F9 (`font-variant-numeric:\ntabular-nums` on `body`, currently only four scattered uses) and F6 (139 raw `px` in\nspacing and radius → `var(--space-*)` / `var(--radius-*)`) — and fix docket #48.\n\n**Why:** The layout is the deliverable; F6/F9 and #48 are open findings on exactly\nthe CSS block this task already rewrites, so folding them in avoids a second pass\nover the same lines.\n\n**Files:**\n\n- Modify: `skills/session-report/template.html` — CSS region only (`:472-1305`)\n\n**Interfaces:**\n\n- Produces: class names Task 2's markup binds to — `.strip`, `.shell`, `.rail`,\n  `.rail-nav`, `.rail-block`, `.rail-h`, `.proj`, `.proj-bar`, `.spark`,\n  `.anomaly`, `.anomaly--bad`, `.anomaly--warn`, `.fold`, `table.cmp`\n- Consumes: the kit's existing tokens and `h2::before`\n\n**Sketch:**\n\n```css\n/* docket #48 — the surface's extension tokens are dark-first on a bare :root\n   with light values in a bare media query and NO [data-theme] block, so\n   clicking Dark on a light system leaves --secondary (and --titlebar, which\n   aliases it) at cream. Restate BOTH halves; mirrors core.css:84-85,130. */\n@media (prefers-color-scheme: light) {\n  :root:not([data-theme=\"dark\"]) { /* …the existing light values… */ }\n}\n:root[data-theme=\"light\"] { /* …same set… */ }\n:root[data-theme=\"dark\"]  { /* …the dark values from the bare :root… */ }\n\n/* F9 — closes the last open instance across the three document surfaces */\nbody { font-variant-numeric: tabular-nums; }\n\n/* Folds reuse the caret the surface ALREADY renders on every h2 — adding a\n   summary::before produces a visible double marker. Rotating an inline-block\n   also swallows the trailing space in content:\"▸ \", hence margin-right. */\n.fold > summary { list-style: none; cursor: pointer; }\n.fold > summary::-webkit-details-marker { display: none; }\n.fold > summary h2::before { display: inline-block; margin-right: .3em;\n  transition: transform .15s ease; }\n.fold[open] > summary h2::before { transform: rotate(90deg); }\n@media (prefers-reduced-motion: reduce) {\n  .fold > summary h2::before { transition: none; }\n}\n```\n\n**Gotchas:**\n\n- The strip background must be **solid** (`var(--titlebar)`); a translucent sticky\n  header bleeds the content scrolling under it. This was Harvey's first note.\n- Do the #48 fix **before** styling the strip — the strip aliases `--titlebar`,\n  which aliases the broken `--secondary`, so an unfixed strip paints cream on dark.\n- F6: `section { margin-top: 26px }`, `.term-body { padding: 22px 30px 30px }`,\n  `body { padding: … 80px }`, `.titlebar { padding: 10px … }`, `.section-body\n  { margin-top: 10px }`, `footer { margin-top: 28px }` are the visible offenders;\n  sweep the whole block, don't spot-fix.\n- Keep `.term { max-width }` growth modest — the rail costs the body ~132px, so the\n  specimen widens `.term` to 1320px to compensate.\n- No egress: no `@import`, no webfont, no remote asset.\n\n**Dependencies:** None\n\n---\n\n## Task 2: Markup restructure — strip, rail, folds, section set\n\n**What:** Restructure `<body>`: insert the sticky anomaly strip under the titlebar,\nwrap the rail and `<main>` in the `.shell` grid, move `<nav id=\"secnav\">` into the\nrail, wrap each section's body in `<details class=\"fold\" open>` with its `<h2>`\npromoted into a `<summary>`, add the `project comparison` section, and remove the\n`prompt size distribution` section while leaving a hidden stub container behind.\n\n**Why:** This is the Cockpit layout itself, plus the evidence-based section-set\nchange (ADD project comparison, TRIM prompt size distribution).\n\n**Files:**\n\n- Modify: `skills/session-report/template.html` — `<body>` region (`:1308-1462`)\n\n**Interfaces:**\n\n- Consumes: Task 1's class names\n- Produces: the container ids Task 3 fills — `#rail-projects`, `#rail-spark`,\n  `#tbl-compare`; and the preserved stub `#prompt-histogram`\n\n**Sketch:**\n\n```html\n<div class=\"strip\">                       <!-- NOT data-kit-chrome: Q13 -->\n  <div class=\"anomaly anomaly--bad\"><span class=\"v\" id=\"an-breaks\">—</span>\n    <span class=\"k\">cache breaks &gt;100k</span></div>\n  …\n</div>\n<div class=\"shell\">\n  <aside class=\"rail\">\n    <div class=\"rail-block\"><div class=\"rail-h\">projects</div>\n      <div id=\"rail-projects\"></div></div>\n    <div class=\"rail-block\"><div class=\"rail-h\">27 days</div>\n      <div class=\"spark\" id=\"rail-spark\"></div></div>\n    <div class=\"rail-block\" data-kit-chrome>   <!-- only the nav is chrome -->\n      <div class=\"rail-h\">sections</div>\n      <nav class=\"secnav rail-nav\" id=\"secnav\" aria-label=\"Report sections\"></nav>\n    </div>\n  </aside>\n  <main class=\"term-body\" id=\"main\" tabindex=\"-1\">\n    …\n    <section data-kit-section>\n      <div class=\"hr\"></div>\n      <details class=\"fold\" open>\n        <summary><h2>skills</h2></summary>       <!-- C2: h2 inside summary -->\n        <div class=\"section-body scroll\">…</div> <!-- C4: body shape unchanged -->\n      </details>\n    </section>\n    …\n    <!-- C7: the render writes to #prompt-histogram unguarded. Keep a hidden\n         stub so the trimmed section has somewhere harmless to land — the same\n         idiom the no-sessions path already uses (see :1921-1922). -->\n    <div id=\"prompt-histogram\" hidden></div>\n  </main>\n</div>\n```\n\n**Gotchas:**\n\n- **C7 is the trap that cost a debugging round.** Deleting the histogram section\n  without the stub throws `null.innerHTML`, which kills every later render step —\n  the nav builder included, leaving **0 chips**. Either the stub or a guard in\n  Task 3; the plan takes the stub because it's local to this task.\n- **C2:** the hint `<span>` must remain a *later child of the `h2`*, not a sibling\n  of it — the nav label is `h2.childNodes[0]`.\n- **C4:** wrap the section body, never the drill list itself.\n- **C6:** `#hero` stays where it is, with a usable `afterend` slot.\n- The agent-fill markers `<!-- AGENT: anomalies -->` and\n  `<!-- AGENT: optimizations -->` move inside their `<details>` — Task 4 must\n  match.\n- Keep every section inside `.term-body` (C1).\n\n**Dependencies:** Task 1\n\n---\n\n## Task 3: Render JS — rail data, comparison table, reveal, print\n\n**What:** Extend the report render to (a) fill `#rail-projects` and `#rail-spark`\nfrom `by_project` and `by_day`, (b) fill the strip's three anomaly figures, (c)\nrender `#tbl-compare` from `by_project`, and (d) add the two behaviours the folds\nrequire — a capture-phase `reveal()` on nav-click and `hashchange`, and\n`beforeprint` / `afterprint` handlers.\n\n**Why:** The rail and comparison table are static in the specimen; shipping means\nmoving them into the render. C8 and C9 are regressions the folds introduce, so\nthey ship in the same task that makes folds real.\n\n**Files:**\n\n- Modify: `skills/session-report/template.html` — render IIFE (`:1836`–end)\n\n**Interfaces:**\n\n- Consumes: Task 2's `#rail-projects`, `#rail-spark`, `#tbl-compare`, `#an-*`\n- Produces: `reveal(node)` — opens every `<details>` inside `node` **and** every\n  `<details>` ancestor of it. Returns `undefined`.\n\n**Sketch:**\n\n```js\n/* The <details> is a CHILD of the target <section>, not an ancestor — walking\n   up alone finds nothing and the chip lands on a 48px closed bar. Both\n   directions, or this silently does nothing. */\nfunction reveal(node) {\n  var inner = node.querySelectorAll ? node.querySelectorAll('details') : [];\n  for (var j = 0; j < inner.length; j++) inner[j].open = true;\n  for (var n = node; n && n !== document; n = n.parentNode) {\n    if (n.tagName === 'DETAILS' && !n.open) n.open = true;\n  }\n}\n/* Capture phase, so the shipped chip handler still does the scrolling. */\ndocument.addEventListener('click', function (e) { /* match chip → section → reveal */ }, true);\nwindow.addEventListener('hashchange', function () { /* reveal + scrollIntoView */ });\n\n/* A collapsed <details> prints nothing; open all for print, restore after. */\nvar wasClosed = [];\nwindow.addEventListener('beforeprint', function () { /* open, remember */ });\nwindow.addEventListener('afterprint',  function () { /* restore */ });\n```\n\n**Gotchas:**\n\n- Match the surrounding style: the render IIFE uses `var`, no template literals,\n  no regex — the kit region documents why (inlining safety). Stay consistent.\n- `by_project` keys are raw paths (`-home-hieuvi-projects-terminus`); strip the\n  prefix for display, and **HTML-escape** every transcript-derived label — the\n  existing `esc()` helper is right there and `SKILL.md:72` already mandates it.\n- `-tmp` stays in the comparison table by design (1300 of 1411 sessions for $42);\n  do not filter it.\n- The comparison table's \"dominant model\" is `by_project[k].by_model` sorted by\n  `costTotal` desc, first entry.\n- Guard `by_day`/`by_project` being empty — the no-sessions path must still work.\n\n**Dependencies:** Task 2\n\n---\n\n## Task 4: SKILL.md fill instructions\n\n**What:** Update `skills/session-report/SKILL.md` so the agent-fill steps match the\nnew markup, and make `recommendations` substantially more prescriptive — a concrete\nchecklist of what to look for rather than \"1–4 suggestions\".\n\n**Why:** `findings` and `recommendations` are agent-filled between `<!-- AGENT: … -->`\nmarkers. Task 2 moves those markers inside `<details>`, and \"more comprehensive\nrecommendations\" is a fill-instruction change by definition. If the markup moves and\nthe instructions don't, every future report is subtly wrong.\n\n**Files:**\n\n- Modify: `skills/session-report/SKILL.md:60-72`\n\n**Interfaces:**\n\n- Consumes: Task 2's marker positions and the new `project comparison` section\n- Produces: None\n\n**Gotchas:**\n\n- Give `recommendations` named signals to check, each tied to a data path:\n  cache breaks vs `overall.cache_breaks_over_100k`, subagent cost vs\n  `overall.subagent.avg_tokens_per_call`, model mix vs `by_project[].by_model`,\n  and per-project efficiency vs `by_project[].efficiency_score`. Vague\n  instructions are what produced \"No suggestions generated yet.\"\n- Frontmatter is a **narrow canonical grammar** — single quotes are banned. If a\n  frontmatter line changes at all, run `node scripts/check-frontmatter.mjs --fix`\n  rather than hand-fixing.\n- Keep `description` ≤ 500 chars and total frontmatter ≤ 1024.\n- The HTML-escaping mandate at `:72` must survive the rewrite.\n\n**Dependencies:** Task 2\n\n---\n\n## Task 5: docket #48 on board-shell.html\n\n**What:** Apply the same `[data-theme]` token fix to\n`skills/record/server/board-shell.html` — convert its bare\n`@media (prefers-color-scheme: light) { :root { … } }` to\n`:root:not([data-theme=\"dark\"])` and add matching `:root[data-theme=\"light\"]`\nand `:root[data-theme=\"dark\"]` blocks.\n\n**Why:** #48's board-shell instance is **orphaned** — the board's step-2 PR already\nshipped (#93/#95), so there is no future board PR to fold it into. It is a\nself-contained CSS block and this PR is already fixing the identical defect next door.\n\n**Files:**\n\n- Modify: `skills/record/server/board-shell.html` — token blocks only\n\n**Interfaces:**\n\n- Consumes: None. Produces: None. (Deliberately isolated from Tasks 1–4.)\n\n**Gotchas:**\n\n- Board-shell's extension token set is **not identical** to session-report's —\n  read its actual block rather than copying session-report's token list.\n- This bumps **docket**, not session-report (Task 7).\n- No layout change here; tokens only. The board's step-2 layout already shipped.\n\n**Dependencies:** None\n\n---\n\n## Task 6: tests/session-report-surface.test.mjs\n\n**What:** New test file pinning the surface's structure, mirroring\n`tests/session-handoff-surface.test.mjs` — including its `outsideKitRegions()`\nhelper so surface assertions never accidentally match kit source.\n\n**Why:** Every constraint in this plan was discovered by breaking the page; without\npins they regress silently. C7 in particular produced a *fully blank nav* with no\nerror visible on the page itself.\n\n**Files:**\n\n- Create: `tests/session-report-surface.test.mjs`\n\n**Interfaces:**\n\n- Consumes: `outsideKitRegions()` pattern from `session-handoff-surface.test.mjs`\n- Produces: None\n\n**Gotchas:**\n\nAssert, at minimum, one pin per discovered constraint:\n\n- `[data-theme=\"light\"]` and `[data-theme=\"dark\"]` blocks exist **outside** the kit\n  regions and define the **same token set** (the #48 class — this is the assertion\n  worth generalizing to all four surfaces later)\n- every `<section data-kit-section>` contains an `h2` (C2), and the `h2`'s first\n  child is a text node, not a `<span>`\n- a `#prompt-histogram` container exists even though its section does not (C7)\n- `reveal` is referenced by both a `click` and a `hashchange` listener (C8)\n- `beforeprint` and `afterprint` listeners exist (C9)\n- `.strip` does **not** carry `data-kit-chrome`; the rail's nav block does (Q13)\n- `body` sets `font-variant-numeric: tabular-nums` (F9)\n- no raw `px` remains in the surface's spacing/radius declarations (F6)\n\n**Dependencies:** Tasks 1, 2, 3\n\n---\n\n## Task 7: Version bumps and changelogs\n\n**What:** Run the `toolkit-change-control` gate to pick the bumps, then apply:\nsession-report `1.10.0 → 1.11.0` (minor — new section, removed section, layout\nchange) and docket `0.10.1 → 0.10.2` (patch — token fix only). Write changelog\nentries via `node scripts/release-plugins.mjs --write-changelog`.\n\n**Why:** `release-plugins.test.mjs` fails when a shipped version has no\n`CHANGELOG.md` entry, and CI tags whatever version a merge to `main` introduces.\n\n**Files:**\n\n- Modify: `dist/plugins/session-report/.claude-plugin/plugin.json` + `.codex-plugin/plugin.json`\n- Modify: `dist/plugins/docket/.claude-plugin/plugin.json` + `.codex-plugin/plugin.json`\n- Modify/Create: the two `CHANGELOG.md` files\n\n**Interfaces:**\n\n- Consumes: the completed work of Tasks 1–6. Produces: None.\n\n**Gotchas:**\n\n- **No changeset needed.** session-report is not in the condux bundle and\n  `packages/condux-opencode/` does not carry it, so `npm-channel.test.mjs` does not\n  apply. (plan-review, the *next* surface, is the one that will need\n  `pnpm changeset` — Q8.)\n- `manifest-parity.test.mjs` requires the Claude and Codex manifests agree on\n  version — bump both.\n- Run the change-control gate **before** `release`, per the skill's own routing.\n- Never hand-tag; CI tags on merge.\n\n**Dependencies:** Tasks 1–6\n\n---\n\n## Task 8: Spec updates, specimen promotion, docket note\n\n**What:** Promote the signed-off specimen to a committed path, then correct and\nextend the surface-kit spec and note progress on docket #48.\n\n**Why:** `durable-citations.test.mjs` forbids a committed file citing a `.condux/`\npath, so the specimen must be promoted **before** any spec text references it. The\nstale line counts and the ratified order flip are corrections this PR owes the spec.\n\n**Files:**\n\n- Create: `specs/surface-kit/session-report-direction-c.html` (from\n  `.condux/designs/2026-08-22-session-report-surface/direction-c2-cockpit-revised.html`)\n- Modify: `specs/surface-kit/implementation.md:57-66` — real line counts\n  (plan-review 1761/21 flex, session-report 2452/11 flex) and the **flip**:\n  session-report 3rd, plan-review 4th, with the reasoning (4 trees + changeset +\n  interactive popover anchoring beats raw file size as a risk proxy)\n- Modify: `specs/surface-kit/index.md` — D9 changelog entry, citing the promoted\n  specimen and recording Q17 (C7, the unguarded render), Q18 (C8/C9, folds break\n  nav and print) and Q19 (`data-kit-chrome` is print suppression, so a dashboard's\n  headline blocks must not carry it)\n- Modify: `specs/surface-kit/audit.md` — F9 now closed on all three document\n  surfaces; F6 session-report count 139 → 0\n- Modify: `docket/DOCKET.md` — #48 status update: session-report and board-shell\n  fixed; **plan-review remains**, so the item stays open\n\n**Interfaces:**\n\n- Consumes: the specimen file. Produces: None.\n\n**Gotchas:**\n\n- **Promote before citing** — `durable-citations.test.mjs` is the guard and it will\n  fail the build otherwise.\n- Do **not** close docket #48 — one of its three surfaces (plan-review) is still\n  broken. Append a status update; closing means moving to the archive.\n- `spec-index.test.mjs` checks the catalog index; if a new spec file is added, the\n  index must list it.\n- The generalized four-surface `[data-theme]` pinning test stays **out** of this PR\n  (it would fail on plan-review) — note it as landing with the final surface PR.\n\n**Dependencies:** Tasks 1–6\n\n---\n\n## Task 9: Sync, full verify, live-verify\n\n**What:** Propagate to every dist tree, run the full suite, and verify the real\nrendered report in a browser.\n\n**Why:** Four channels read four different trees; `dist-mirror`, `opencode-dist`\nand `cursor-dist` tests all fail on drift. And the render JS changed, which is the\none class of change that can break a report for a real user — tests do not open a\nbrowser.\n\n**Files:**\n\n- Modify (generated): all `dist/` mirrors for session-report and docket\n\n**Interfaces:**\n\n- Consumes: Tasks 1–8. Produces: None.\n\n**Gotchas:**\n\n- `bash scripts/sync.sh session-report` **and** `bash scripts/sync.sh record`\n  (board-shell lives under the `record` skill, which owns `server/`).\n- Then `node --test` — expect `session-report-surface`, `dist-mirror`,\n  `opencode-dist`, `cursor-dist`, `manifest-parity`, `release-plugins`,\n  `durable-citations` all green.\n- The pre-commit hook stages **all** of `dist/` unconditionally; a split commit\n  touching dist needs `--no-verify` after a manual sync.\n- **Live-verify** by generating a real report\n  (`node skills/session-report/analyze-claude.mjs --json --since 30d`, injected into\n  the built template) and checking in the browser: nav chip into a *collapsed*\n  section lands on content (not a 48px bar), a `#sec-…` deep link does the same,\n  theme toggle is correct in **both** directions on a light system, and print\n  preview shows collapsed sections' contents.\n- Known flake: `annotate-server.test.mjs` races the feedback write — that's\n  docket #49, not this change.\n\n**Dependencies:** Tasks 1–8\n";
