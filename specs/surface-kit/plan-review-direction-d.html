    <script>
/* kit:js:start */
/* Shared behaviour layer — do not hand-edit; edit scripts/tokens/kit.js. */

/* Deliberately free of backticks and interpolation openers. No target is a JS
   template literal since the board-shell extraction, so this is insurance
   rather than a requirement — but it is the difference between this file being
   safe to inline anywhere and being safe only where someone remembered to
   check. Regexes and escapes are avoided for the same reason. */

(function () {
  'use strict';

  var THEME_KEY = 'jabworks-theme';
  var THEME_MODES = ['light', 'dark', 'system'];
  var root = document.documentElement;

  /* localStorage throws on an opaque origin, which is what a file:// artifact
     often gets. Degrade to session-only theming; never break the page. */
  function readStored(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function writeStored(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {
      /* no-op */
    }
  }

  function applyTheme(mode) {
    if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
    else root.removeAttribute('data-theme');

    writeStored(THEME_KEY, mode);

    var buttons = document.querySelectorAll('[data-kit-theme]');

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(buttons[i].getAttribute('data-kit-theme') === mode));
    }
  }

  function currentTheme() {
    return root.getAttribute('data-theme') || 'system';
  }

  function cycleTheme() {
    applyTheme(THEME_MODES[(THEME_MODES.indexOf(currentTheme()) + 1) % THEME_MODES.length]);
  }

  function items() {
    return Array.prototype.slice.call(document.querySelectorAll('[data-kit-item]'));
  }

  /* document.activeElement is null in a detached or not-yet-painted document,
     and Element.closest is absent on the document node itself. */
  function activeWithin(selector) {
    var el = document.activeElement;

    return el && el.closest ? el.closest(selector) : null;
  }

  function moveItem(step) {
    var all = items();

    if (all.length === 0) return;

    var index = all.indexOf(activeWithin('[data-kit-item]'));
    var next = all[Math.min(Math.max(index + step, 0), all.length - 1)] || all[0];

    next.setAttribute('tabindex', '-1');
    next.focus();
    next.scrollIntoView({ block: 'nearest' });

    /* Reflect the focused item in the URL so a board or a review can be linked
       to a specific row. replaceState, not a hash assignment: assigning to
       location.hash pushes a history entry per keypress. */
    if (next.id && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '#' + next.id);
    }
  }

  function reveal(el) {
    if (el && el.focus) {
      el.focus();
      if (el.select) el.select();

      return true;
    }

    return false;
  }

  /* A surface whose filter field ships hidden cannot hang the hook on the field
     itself — a hidden element does not take focus, so the binding would be a
     silent no-op. Those surfaces put the hook on the control that REVEALS the
     field instead; activate it, then focus what it revealed via aria-controls.
     Without this the ? overlay would advertise "Focus filter" for a key that
     only moves focus to a button, and a generated overlay that misdescribes its
     own bindings is worse than no overlay. */
  function focusFilter() {
    var hook = document.querySelector('[data-kit-filter]');

    if (!hook) return false;

    if (hook.tagName === 'BUTTON') {
      if (hook.getAttribute('aria-expanded') === 'false' && hook.click) hook.click();

      if (reveal(document.getElementById(hook.getAttribute('aria-controls') || ''))) return true;
    }

    return reveal(hook);
  }

  function flashCopied(el) {
    el.classList.add('kit-copied');
    window.setTimeout(function () {
      el.classList.remove('kit-copied');
    }, 900);
  }

  function copyFrom(el) {
    if (!el) return;

    var text = el.getAttribute('data-kit-copy') || el.textContent || '';

    if (!text || !navigator.clipboard || !navigator.clipboard.writeText) return;

    navigator.clipboard.writeText(text.trim()).then(
      function () {
        flashCopied(el);
      },
      function () {
        /* Clipboard is permission-gated; a refusal is not an error worth
           interrupting the page for. */
      },
    );
  }

  function sections() {
    return Array.prototype.slice.call(document.querySelectorAll('[data-kit-section]'));
  }

  function jumpToSection(n) {
    var target = sections()[n - 1];

    if (target) target.scrollIntoView({ block: 'start' });
  }

  /* One registry drives both the key handler and the help overlay, so the
     documented shortcuts cannot drift from the implemented ones. */
  var BINDINGS = [
    { keys: ['j'], label: 'Next item', when: function () { return items().length > 0; }, run: function () { moveItem(1); } },
    { keys: ['k'], label: 'Previous item', when: function () { return items().length > 0; }, run: function () { moveItem(-1); } },
    {
      keys: ['/'],
      label: 'Focus filter',
      when: function () { return Boolean(document.querySelector('[data-kit-filter]')); },
      run: focusFilter,
    },
    {
      keys: ['y'],
      label: 'Copy id or path',
      when: function () { return Boolean(document.querySelector('[data-kit-copy]')); },
      run: function () {
        copyFrom(activeWithin('[data-kit-copy]'));
      },
    },
    { keys: ['t'], label: 'Cycle theme', when: function () { return true; }, run: cycleTheme },
    {
      keys: ['g', '1-9'],
      label: 'Jump to section',
      when: function () { return sections().length > 0; },
      run: null,
    },
    { keys: ['?'], label: 'Show shortcuts', when: function () { return true; }, run: null },
    { keys: ['Esc'], label: 'Dismiss', when: function () { return true; }, run: null },
  ];

  var overlay = null;

  function buildOverlay() {
    var host = document.createElement('div');

    host.className = 'kit-help';
    host.hidden = true;
    host.setAttribute('role', 'dialog');
    host.setAttribute('aria-modal', 'true');
    host.setAttribute('aria-label', 'Keyboard shortcuts');

    var panel = document.createElement('div');

    panel.className = 'kit-help__panel';

    var title = document.createElement('p');

    title.className = 'kit-help__title';
    title.textContent = 'Keyboard shortcuts';
    panel.appendChild(title);

    for (var i = 0; i < BINDINGS.length; i++) {
      if (!BINDINGS[i].when()) continue;

      var row = document.createElement('div');

      row.className = 'kit-help__row';

      var label = document.createElement('span');

      label.textContent = BINDINGS[i].label;
      row.appendChild(label);

      var keys = document.createElement('span');

      keys.className = 'kit-help__keys';

      for (var k = 0; k < BINDINGS[i].keys.length; k++) {
        var kbd = document.createElement('kbd');

        kbd.className = 'kit-kbd';
        kbd.textContent = BINDINGS[i].keys[k];
        keys.appendChild(kbd);
      }

      row.appendChild(keys);
      panel.appendChild(row);
    }

    host.appendChild(panel);
    host.addEventListener('click', function (event) {
      if (event.target === host) toggleOverlay(false);
    });
    document.body.appendChild(host);

    return host;
  }

  function toggleOverlay(show) {
    if (!overlay) overlay = buildOverlay();

    overlay.hidden = !show;
  }

  function isTypingTarget(el) {
    if (!el) return false;

    var tag = el.tagName;

    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable === true;
  }

  var pendingJump = false;

  function onKeydown(event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;

    if (event.key === 'Escape') {
      toggleOverlay(false);
      if (isTypingTarget(event.target) && event.target.blur) event.target.blur();

      return;
    }

    /* A filter box must be typeable: every other binding is inert while the
       caret is in a field. Escape above is the deliberate exception. */
    if (isTypingTarget(event.target)) return;

    if (pendingJump) {
      pendingJump = false;

      if (event.key >= '1' && event.key <= '9') {
        jumpToSection(Number(event.key));
        event.preventDefault();

        return;
      }
    }

    if (event.key === 'g' && sections().length > 0) {
      pendingJump = true;
      window.setTimeout(function () {
        pendingJump = false;
      }, 1200);

      return;
    }

    if (event.key === '?') {
      toggleOverlay(overlay ? overlay.hidden : true);
      event.preventDefault();

      return;
    }

    for (var i = 0; i < BINDINGS.length; i++) {
      if (BINDINGS[i].run && BINDINGS[i].keys.indexOf(event.key) !== -1 && BINDINGS[i].when()) {
        BINDINGS[i].run();
        event.preventDefault();

        return;
      }
    }
  }

  function init() {
    applyTheme(readStored(THEME_KEY) || 'system');

    var buttons = document.querySelectorAll('[data-kit-theme]');

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function (event) {
        applyTheme(event.currentTarget.getAttribute('data-kit-theme'));
      });
    }

    /* Give the ? overlay a visible way in. It rides alongside the theme group
       because every surface already has one, and because a floating badge is
       chrome each surface would then have to design around. */
    var groups = document.querySelectorAll('.kit-theme');

    for (var g = 0; g < groups.length; g++) {
      if (!groups[g].parentNode) continue;

      var help = document.createElement('button');

      help.type = 'button';
      help.className = 'kit-helpbtn';
      help.textContent = '?';
      help.title = 'Keyboard shortcuts (?)';
      help.setAttribute('aria-label', 'Keyboard shortcuts');
      help.addEventListener('click', function () {
        toggleOverlay(true);
      });

      /* Wrap rather than insert as a sibling: a surface may host the theme group
         in a flex row (the board) or in block flow (the guide's rail), and in
         block flow a bare sibling drops onto its own line. The wrapper makes the
         pairing hold in either. */
      var controls = document.createElement('div');

      controls.className = 'kit-controls';
      groups[g].parentNode.insertBefore(controls, groups[g]);
      controls.appendChild(groups[g]);
      controls.appendChild(help);
    }

    document.addEventListener('click', function (event) {
      var target = event.target.closest ? event.target.closest('[data-kit-copy]') : null;

      if (target) copyFrom(target);
    });

    document.addEventListener('keydown', onKeydown);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
/* kit:js:end */
    </script>

    <script>
      // ---- Self-contained Markdown renderer (no external deps) ----
      function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
      function safeHref(s){const h=String(s).trim();const compact=h.replace(/[\u0000-\u0020]+/g,'');return /^(javascript|data|vbscript):/i.test(compact)?'#':h;}
      function inline(s){
        const codes=[];
        s=esc(s).replace(/`([^`]+)`/g,function(_,c){codes.push('<code>'+c+'</code>');return '\u0000'+(codes.length-1)+'\u0000';});
        s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
           .replace(/__([^_]+)__/g,'<strong>$1</strong>')
           .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
           .replace(/(^|[^\w_])_([^_]+)_(?![\w_])/g,'$1<em>$2</em>')
           .replace(/~~([^~]+)~~/g,'<del>$1</del>')
           .replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,label,href){return '<a href="'+safeHref(href)+'" rel="noopener noreferrer">'+label+'</a>';});
        return s.replace(/\u0000(\d+)\u0000/g,function(_,n){return codes[+n];});
      }
      function renderBlocks(md){
        const lines=md.replace(/\r\n/g,'\n').split('\n'); const out=[]; let i=0;
        function tcells(row){ return row.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); }
        function isDelim(row){ if(row.indexOf('|')<0) return false; const cs=tcells(row); return cs.length>0 && cs.every(function(c){return /^:?-{1,}:?$/.test(c);}); }
        while(i<lines.length){let line=lines[i];
          if(/^```/.test(line)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push({html:'<pre><code>'+esc(buf.join('\n'))+'</code></pre>',heading:null});continue;}
          if(/^\s*$/.test(line)){i++;continue;}
          if(/^#{1,6}\s/.test(line)){const lvl=line.match(/^#+/)[0].length;const text=line.replace(/^#+\s/,'');out.push({html:'<h'+lvl+'>'+inline(text)+'</h'+lvl+'>',heading:{level:lvl,text:text}});i++;continue;}
          if(/^---+\s*$/.test(line)){out.push({html:'<hr>',heading:null});i++;continue;}
          if(/^\s*>/.test(line)){const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));out.push({html:'<blockquote>'+inline(buf.join(' '))+'</blockquote>',heading:null});continue;}
          // Lazy continuation: a soft-wrapped bullet leaves its follow-on lines with no
          // marker. Advancing only on marker lines ended the list there and rendered the
          // remainder as a left-margin paragraph — every wrapped bullet in every spec.
          // The exclusion set is deliberately the paragraph loop's below, not a new one.
          if(/^\s*([-*+]|\d+\.)\s/.test(line)){const ordered=/^\s*\d+\./.test(line);const buf=[];while(i<lines.length&&/^\s*([-*+]|\d+\.)\s/.test(lines[i])){let it=lines[i].replace(/^\s*([-*+]|\d+\.)\s/,'');i++;while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+\.)\s|---+\s*$)/.test(lines[i])&&!(lines[i].indexOf('|')>=0&&i+1<lines.length&&isDelim(lines[i+1]))){it+=' '+lines[i].trim();i++;}const cb=it.match(/^\[([ xX])\]\s+/);if(cb){it=it.slice(cb[0].length);buf.push('<li class="task">'+(/[xX]/.test(cb[1])?'☑':'☐')+' '+inline(it)+'</li>');}else{buf.push('<li>'+inline(it)+'</li>');}}out.push({html:'<'+(ordered?'ol':'ul')+'>'+buf.join('')+'</'+(ordered?'ol':'ul')+'>',heading:null});continue;}
          if(line.indexOf('|')>=0&&i+1<lines.length&&isDelim(lines[i+1])){const header=tcells(line);const aligns=tcells(lines[i+1]).map(function(c){const l=/^:/.test(c),r=/:$/.test(c);return l&&r?'center':r?'right':l?'left':'';});i+=2;const rows=[];while(i<lines.length&&lines[i].indexOf('|')>=0&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|```|---+\s*$)/.test(lines[i])){rows.push(tcells(lines[i]));i++;}let h='<table><thead><tr>';header.forEach(function(c,ci){h+='<th'+(aligns[ci]?' style="text-align:'+aligns[ci]+'"':'')+'>'+inline(c)+'</th>';});h+='</tr></thead><tbody>';rows.forEach(function(cs){h+='<tr>';header.forEach(function(_,ci){h+='<td'+(aligns[ci]?' style="text-align:'+aligns[ci]+'"':'')+'>'+inline(cs[ci]!==undefined?cs[ci]:'')+'</td>';});h+='</tr>';});h+='</tbody></table>';out.push({html:h,heading:null});continue;}
          const buf=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+\.)\s|---+\s*$)/.test(lines[i])&&!(lines[i].indexOf('|')>=0&&i+1<lines.length&&isDelim(lines[i+1])))buf.push(lines[i++]);
          out.push({html:'<p>'+inline(buf.join(' '))+'</p>',heading:null});}
        return out;
      }

      // ---- API error banner (kit-error) ----
      function showApiError(msg){
        const el=document.getElementById('api-error'); if(!el) return;
        el.querySelector('.msg-text').textContent=msg; el.hidden=false;
      }
      function hideApiError(){
        const el=document.getElementById('api-error'); if(el) el.hidden=true;
      }

      // ---- State ----
      const annotations = []; let nextId = 1;
      const planEl=document.getElementById('plan');
      const tocEl=document.getElementById('toc');
      const pop=document.getElementById('popover');
      const popQuote=document.getElementById('pop-quote');
      const popText=document.getElementById('pop-text');
      const popCats=document.getElementById('pop-cats');
      const main=document.querySelector('.main');
      let pendingRange=null, pendingQuote='', pendingSection='', pendingCat=null, selDoc=null;
      function setCat(cat){ pendingCat=cat; popCats.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.cat===cat);}); }
      // Step 1 shows just the quote + category menubar. Choosing a category expands
      // the toolbar to reveal the note input and action buttons (step 2).
      popCats.querySelectorAll('.chip').forEach(function(c){
        c.onmousedown=function(e){ e.preventDefault(); }; // keep the text selection alive
        c.onclick=function(){ setCat(c.dataset.cat); pop.classList.add('expanded'); placePopover(); popText.focus(); };
      });

      // ---- Documents: one pane per doc (a single plan file, or a spec dir) ----
      // Panes stay in the DOM when hidden, so highlights and note anchors on an
      // inactive doc survive switching back and forth.
      let DIRMODE=false, docs=[], activeDoc=null;
      const docState={}; // name -> { md, pane, scroll, key, headings }

      function renderDocPane(doc, md){
        const st=docState[doc];
        st.md=md; st.pane.innerHTML=''; st.headings=[];
        let section='(top)';
        renderBlocks(md).forEach(function(b,idx){
          const id=st.key+'-blk-'+idx;
          const wrap=document.createElement('div'); wrap.className='blk'; wrap.id=id; wrap.innerHTML=b.html;
          if(b.heading){ section=id; st.headings.push({id:id,level:b.heading.level,text:b.heading.text}); }
          wrap.dataset.section=section; st.pane.appendChild(wrap);
        });
      }

      // ---- Directory-mode doc-site tree: collapsible folders, filter, chrome ----
      // Collapse state lives in memory only (review tabs are short-lived); seeded
      // so the active doc's ancestors are always open. The filter is a transient
      // view — it never touches openFolders (snapshot restored on clear) and
      // never affects what gets submitted.
      let openFolders=new Set(), treeFilter='', preFilterOpen=null;
      function parentOf(p){ const s=p.lastIndexOf('/'); return s>=0?p.slice(0,s):''; }
      function seedOpen(doc){ let f=parentOf(doc); while(f){ openFolders.add(f); f=parentOf(f); } }
      function headingAnchor(doc,h,lvl){
        const a=document.createElement('a'); a.href='#'+h.id;
        a.className='lvl'+lvl; a.dataset.target=h.id; a.dataset.doc=doc;
        const t=document.createElement('span'); t.className='t'; t.textContent=h.text; a.appendChild(t);
        const bd=document.createElement('span'); bd.className='badge badge-warning'; bd.style.display='none'; bd.dataset.for=h.id; a.appendChild(bd);
        a.onclick=function(e){ e.preventDefault(); if(doc!==activeDoc)switchDoc(doc);
          document.getElementById(h.id).scrollIntoView({behavior:'smooth',block:'start'}); };
        return a;
      }
      function renderTree(){
        const q=treeFilter.trim().toLowerCase(), mcache={};
        // docs[] arrives folder-grouped (root first, index.md first per folder);
        // rebuilding the tree and walking docs-then-sorted-dirs reproduces that
        // order exactly — docs[] stays the one source of truth.
        const root={dirs:{},docs:[]};
        docs.forEach(function(doc){
          const parts=doc.split('/'); let node=root;
          for(let i=0;i<parts.length-1;i++) node=node.dirs[parts[i]]||(node.dirs[parts[i]]={dirs:{},docs:[]});
          node.docs.push(doc);
        });
        function matches(doc){
          if(!q) return {show:true,heads:null};
          if(mcache[doc]) return mcache[doc];
          const heads=docState[doc].headings.filter(function(h){return h.text.toLowerCase().indexOf(q)>=0;});
          const name=doc.toLowerCase().indexOf(q)>=0;
          return (mcache[doc]={show:name||heads.length>0,heads:heads});
        }
        function indent(el,depth){ el.style.paddingLeft=(6+Math.min(depth,3)*12)+'px'; }
        function hasMatch(node){
          return node.docs.some(function(d){return matches(d).show;})
            || Object.keys(node.dirs).some(function(k){return hasMatch(node.dirs[k]);});
        }
        (function walk(node,pathStr,depth){
          node.docs.forEach(function(doc){
            const m=matches(doc); if(!m.show) return;
            const d=document.createElement('a'); d.href='#'; d.className='doc'+(doc===activeDoc?' active':''); d.dataset.doc=doc; d.title=doc;
            d.setAttribute('data-kit-item','');
            indent(d,depth);
            const t=document.createElement('span'); t.className='t'; t.textContent=doc.slice(pathStr?pathStr.length+1:0); d.appendChild(t);
            const bd=document.createElement('span'); bd.className='badge badge-warning'; bd.style.display='none'; bd.dataset.fordoc=doc; d.appendChild(bd);
            d.onclick=function(e){ e.preventDefault(); switchDoc(doc); main.scrollTop=0; };
            tocEl.appendChild(d);
            // Headings: the active doc's under it normally; matched ones under any
            // hit while filtering. A doc with no headings gets no stub.
            const hs=q?m.heads:(doc===activeDoc?docState[doc].headings:[]);
            hs.forEach(function(h){ const a=headingAnchor(doc,h,Math.min(h.level+1,3)); indent(a,depth+1); tocEl.appendChild(a); });
          });
          Object.keys(node.dirs).sort().forEach(function(name){
            const sub=pathStr?pathStr+'/'+name:name;
            if(q&&!hasMatch(node.dirs[name])) return;
            const open=q?true:openFolders.has(sub);
            const row=document.createElement('a'); row.href='#'; row.className='folder'; row.title=sub;
            indent(row,depth);
            const ar=document.createElement('span'); ar.className='arrow'; ar.textContent=open?'▾':'▸'; row.appendChild(ar);
            const t=document.createElement('span'); t.className='t'; t.textContent=name+'/'; row.appendChild(t);
            const bd=document.createElement('span'); bd.className='badge badge-warning'; bd.style.display='none'; bd.dataset.forfolder=sub; bd.dataset.open=open?'1':''; row.appendChild(bd);
            row.onclick=function(e){ e.preventDefault(); if(q)return;
              if(openFolders.has(sub))openFolders.delete(sub); else openFolders.add(sub); buildToc(); };
            tocEl.appendChild(row);
            if(open) walk(node.dirs[name],sub,depth+1);
          });
        })(root,'',0);
        if(q&&!tocEl.children.length){ const n=document.createElement('div'); n.className='none'; n.textContent='No matches.'; tocEl.appendChild(n); }
      }
      function buildToc(){
        tocEl.innerHTML='';
        if(DIRMODE){ renderTree(); }
        else docs.forEach(function(doc){
          docState[doc].headings.forEach(function(h){ tocEl.appendChild(headingAnchor(doc,h,h.level)); });
        });
        observeHeadings(); updateBadges();
      }

      function updateChrome(){
        if(!DIRMODE||!activeDoc) return;
        const crumbs=document.getElementById('crumbs'); crumbs.innerHTML=''; crumbs.style.display='block';
        const rootName=document.title.replace(/^review:\s*/,'');
        const r=document.createElement('span'); r.className='seg'; r.textContent=rootName; crumbs.appendChild(r);
        const parts=activeDoc.split('/');
        parts.forEach(function(seg,i){
          const sep=document.createElement('span'); sep.className='sep'; sep.textContent='›'; crumbs.appendChild(sep);
          if(i<parts.length-1){
            const f=parts.slice(0,i+1).join('/');
            const a=document.createElement('a'); a.className='seg'; a.textContent=seg;
            a.onclick=function(e){ e.preventDefault();
              const qEl=document.getElementById('tree-q');
              if(qEl&&qEl.value){ qEl.value=''; qEl.oninput(); }   // a filtered tree ignores fold state — clear first
              let g=f; while(g){ openFolders.add(g); g=parentOf(g); } buildToc(); };
            crumbs.appendChild(a);
          } else { const c=document.createElement('span'); c.className='seg cur'; c.textContent=seg; crumbs.appendChild(c); }
        });
        const pnav=document.getElementById('pnav'); pnav.innerHTML=''; pnav.style.display='flex';
        const idx=docs.indexOf(activeDoc);
        function jump(d,label){
          const a=document.createElement('a'); a.href='#'; a.title=d;
          a.textContent=label; a.onclick=function(e){ e.preventDefault(); switchDoc(d); main.scrollTop=0; };
          return a;
        }
        if(idx>0) pnav.appendChild(jump(docs[idx-1],'← '+docs[idx-1].split('/').pop()));
        const sp=document.createElement('span'); sp.className='spacer'; pnav.appendChild(sp);
        if(idx>=0&&idx<docs.length-1) pnav.appendChild(jump(docs[idx+1],docs[idx+1].split('/').pop()+' →'));
      }

      function switchDoc(doc){
        if(activeDoc&&docState[activeDoc]) docState[activeDoc].scroll=main.scrollTop;
        activeDoc=doc;
        docs.forEach(function(d){ docState[d].pane.style.display=d===doc?'':'none'; });
        main.scrollTop=docState[doc].scroll||0;
        if(DIRMODE){ seedOpen(doc); buildToc(); updateChrome(); }
        else observeHeadings();
      }

      // ---- Selection -> highlight ----
      function blockOf(node){ while(node&&node!==planEl){ if(node.classList&&node.classList.contains('blk')) return node; node=node.parentNode; } return null; }

      // Anchor the toolbar to the stored selection; sits above it, flips below
      // only when the selection is too near the top of the scroll area.
      function placePopover(){
        if(!selDoc) return;
        const pw=pop.offsetWidth, ph=pop.offsetHeight;
        const left=Math.max(4, Math.min(selDoc.left, main.scrollWidth-pw-8));
        let top=selDoc.top-ph-10;
        if(top < main.scrollTop+4){ top=selDoc.bottom+10; pop.classList.add('below'); pop.classList.remove('above'); }
        else { pop.classList.add('above'); pop.classList.remove('below'); }
        pop.style.left=left+'px'; pop.style.top=top+'px';
      }
      function openToolbar(){
        popQuote.textContent='“'+pendingQuote+'”'; popText.value='';
        pendingCat=null; popCats.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');});
        pop.classList.remove('expanded');
        pop.style.display='block'; placePopover();
      }
      // Selecting text in the plan opens the menubar above the selection.
      document.addEventListener('mouseup', function(e){
        if(pop.contains(e.target)) return;
        setTimeout(function(){
          const sel=window.getSelection();
          if(!sel.rangeCount||sel.isCollapsed) return;
          const r=sel.getRangeAt(0);
          if(!planEl.contains(r.commonAncestorContainer)||!sel.toString().trim()) return;
          pendingRange=r.cloneRange(); pendingQuote=sel.toString().trim();
          const blk=blockOf(pendingRange.startContainer); pendingSection=blk?blk.dataset.section:'(top)';
          const rect=pendingRange.getBoundingClientRect(); const host=main.getBoundingClientRect();
          selDoc={ left: rect.left-host.left+main.scrollLeft, top: rect.top-host.top+main.scrollTop, bottom: rect.bottom-host.top+main.scrollTop };
          openToolbar();
        },0);
      });

      function highlight(range, aid){
        const root=range.commonAncestorContainer; const base=root.nodeType===3?root.parentNode:root;
        const walker=document.createTreeWalker(base,NodeFilter.SHOW_TEXT,null); const nodes=[]; let n;
        while(n=walker.nextNode()){ if(range.intersectsNode(n)&&n.nodeValue.trim()!=='') nodes.push(n); }
        nodes.forEach(function(node){
          let s=0,e=node.nodeValue.length;
          if(node===range.startContainer) s=range.startOffset;
          if(node===range.endContainer) e=range.endOffset;
          if(s>=e) return;
          const rng=document.createRange(); rng.setStart(node,s); rng.setEnd(node,e);
          const m=document.createElement('mark'); m.className='hl'; m.dataset.aid=String(aid);
          try{ rng.surroundContents(m); }catch(err){}
        });
      }
      function unhighlight(aid){
        document.querySelectorAll('mark.hl[data-aid="'+aid+'"]').forEach(function(m){
          const p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize();
        });
      }

      function saveNote(){
        const text=popText.value.trim(); if(!text||!pendingRange) { closePop(); return; }
        const id=nextId++;
        try{ highlight(pendingRange,id); }catch(e){}
        annotations.push({id:id,kind:'note',cat:pendingCat,quote:pendingQuote,text:text,section:pendingSection,doc:activeDoc});
        closePop(); window.getSelection().removeAllRanges(); paint();
      }
      function closePop(){ pop.style.display='none'; pop.classList.remove('expanded'); pendingRange=null; }
      document.getElementById('pop-save').onclick=saveNote;
      document.getElementById('pop-cancel').onclick=function(){closePop();window.getSelection().removeAllRanges();};
      popText.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter')saveNote(); if(e.key==='Escape')closePop(); });
      document.addEventListener('mousedown',function(e){ if(!pop.contains(e.target)&&pop.style.display==='block') closePop(); });

      // Intra-tree markdown links (e.g. the spec catalog's [x](wan-config/index.md))
      // point at real relative paths so they stay correct for agents/GitHub. In the
      // viewer there is no such URL — resolve the href against the active doc's folder
      // and, if it names a known doc, switch panes instead of hard-navigating to a 404.
      function resolveDocHref(href){
        if(!href||/^(https?:|mailto:|tel:|#|\/\/)/i.test(href)) return null;
        let frag=''; const hash=href.indexOf('#'); if(hash>=0){ frag=href.slice(hash+1); href=href.slice(0,hash); }
        if(!href) return {doc:activeDoc,frag:frag};
        const baseDir=activeDoc&&activeDoc.indexOf('/')>=0?activeDoc.slice(0,activeDoc.lastIndexOf('/')):'';
        const stack=[];
        (baseDir?baseDir.split('/'):[]).concat(href.split('/')).forEach(function(p){
          if(p===''||p==='.')return; if(p==='..')stack.pop(); else stack.push(p);
        });
        const cand=stack.join('/');
        return docs.indexOf(cand)>=0?{doc:cand,frag:frag}:null;
      }
      planEl.addEventListener('click',function(e){
        const a=e.target.closest&&e.target.closest('a');
        if(a&&planEl.contains(a)){
          const t=resolveDocHref(a.getAttribute('href'));
          if(t){ e.preventDefault(); if(t.doc!==activeDoc)switchDoc(t.doc); main.scrollTop=0;
            if(t.frag){ const el=document.getElementById(t.frag); if(el)el.scrollIntoView({behavior:'smooth',block:'start'}); }
            return; }
        }
        const m=e.target.closest&&e.target.closest('mark.hl'); if(!m) return;
        focusNote(m.dataset.aid,true);
      });
      function focusNote(aid,scroll){
        document.querySelectorAll('mark.hl').forEach(function(x){x.classList.toggle('active',x.dataset.aid===String(aid));});
        document.querySelectorAll('.msg.note').forEach(function(x){x.classList.toggle('active',x.dataset.aid===String(aid));});
        if(scroll){const el=document.querySelector('.msg.note[data-aid="'+aid+'"]'); if(el)el.scrollIntoView({block:'nearest'});}
      }

      function sendChat(){ const ta=document.getElementById('input'); const text=ta.value.trim(); if(!text)return;
        annotations.push({id:nextId++,kind:'chat',quote:'',text:text,section:''}); ta.value=''; paint(); }

      // The thread renders in DOCUMENT order, not insertion order, because each
      // highlight carries a CSS counter numbered by document position and the
      // gutter repeats that ordinal. Left in insertion order the two numberings
      // disagree the moment a note is added above an earlier one.
      //
      // Sort a COPY: `annotations` is the identity store that saveNote pushes to
      // and the delete handler indexes into with indexOf, so reordering it in
      // place breaks both. And never reorder the rendered DOM instead — chat
      // messages have no document position and would be shuffled to the top.
      function threadOrder(){
        // Scope the mark lookup to the ACTIVE pane. In DIRMODE every doc's pane
        // stays in the DOM hidden, so a document-wide query happily matches a
        // mark in another document's pane and sorts against it.
        const pane=docState[activeDoc]&&docState[activeDoc].pane;
        const markOf=function(a){ return pane?pane.querySelector('mark.hl[data-aid="'+a.id+'"]'):null; };
        // Array.prototype.sort is stable, so a 0 comparison keeps chat messages
        // — and any note whose mark is missing — in their existing order.
        return annotations.slice().sort(function(x,y){
          if(x.kind!=='note'||y.kind!=='note') return 0;
          const mx=markOf(x), my=markOf(y);
          if(!mx||!my) return 0;
          return (mx.compareDocumentPosition(my)&Node.DOCUMENT_POSITION_FOLLOWING)?-1:1;
        });
      }
      function paint(){
        const box=document.getElementById('thread'); box.innerHTML='';
        document.getElementById('count').textContent=annotations.length?'('+annotations.length+')':'';
        if(!annotations.length){ box.innerHTML='<div class="empty">No notes yet. Select text to comment, or send a message.</div>'; updateBadges(); updateSummary(); return; }
        threadOrder().forEach(function(a){
          const m=document.createElement('div'); m.className='msg'+(a.kind==='note'?' note':''); if(a.kind==='note')m.dataset.aid=String(a.id);
          // The category is otherwise written only as TEXT into .who, and CSS
          // cannot select on text content — this is what the colour rules key on.
          m.dataset.cat=(a.kind==='note'?(a.cat||'Note'):'message');
          // DIRMODE: the thread lists notes from EVERY document, but the in-document
          // ordinal counts only the visible pane — marks inside a display:none pane
          // do not increment a CSS counter. Numbering every row would therefore
          // label a note "3" in the gutter whose highlight reads "1" in the
          // document, which is exactly the divergence the numbering exists to
          // remove. Rows belonging to another document are flagged so they take no
          // ordinal, leaving both sequences running 1..m over the same set.
          if(a.kind==='note'&&a.doc&&a.doc!==activeDoc) m.dataset.otherDoc='1';
          const meta=document.createElement('div'); meta.className='meta';
          const who=document.createElement('span'); who.className='who'; who.textContent=a.kind==='note'?(a.cat||'Note'):'message';
          const del=document.createElement('button'); del.className='del'; del.textContent='×';
          del.onclick=function(ev){ev.stopPropagation(); if(a.kind==='note')unhighlight(a.id); const i=annotations.indexOf(a); annotations.splice(i,1); paint();};
          meta.appendChild(who); meta.appendChild(del); m.appendChild(meta);
          if(a.quote){ const q=document.createElement('div'); q.className='quote'; q.textContent='“'+a.quote+'”'; m.appendChild(q); }
          const body=document.createElement('div'); body.className='body'; body.textContent=a.text; m.appendChild(body);
          if(a.kind==='note') m.onclick=function(){ if(a.doc&&a.doc!==activeDoc)switchDoc(a.doc);
            focusNote(a.id,false); const el=document.getElementById(a.section); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); };
          box.appendChild(m);
        });
        updateBadges(); updateSummary();
      }
      // Live summary in the decision bar — what rides along with the decision.
      function updateSummary(){
        const n=annotations.filter(function(a){return a.kind==='note';}).length;
        const m=annotations.filter(function(a){return a.kind==='chat';}).length;
        const parts=[];
        if(n)parts.push(n+' note'+(n>1?'s':'')); if(m)parts.push(m+' message'+(m>1?'s':''));
        document.getElementById('dbar-summary').textContent=
          parts.length?parts.join(' · ')+' will be sent with your decision':'No notes or messages yet — a decision sends on its own';
      }
      function updateBadges(){
        const counts={}, docCounts={};
        annotations.forEach(function(a){ if(a.kind!=='note')return;
          if(a.section)counts[a.section]=(counts[a.section]||0)+1;
          if(a.doc)docCounts[a.doc]=(docCounts[a.doc]||0)+1; });
        document.querySelectorAll('.nav .badge[data-for]').forEach(function(b){ const c=counts[b.dataset.for]||0; b.textContent=c; b.style.display=c?'inline-flex':'none'; });
        document.querySelectorAll('.nav .badge[data-fordoc]').forEach(function(b){ const c=docCounts[b.dataset.fordoc]||0; b.textContent=c; b.style.display=c?'inline-flex':'none'; });
        // Collapsed folders roll up their docs' counts (doc-level only — heading
        // badges would double-count) so pending feedback is never invisible.
        document.querySelectorAll('.nav .badge[data-forfolder]').forEach(function(b){
          const f=b.dataset.forfolder+'/'; let c=0;
          Object.keys(docCounts).forEach(function(d){ if(d.indexOf(f)===0)c+=docCounts[d]; });
          b.textContent=c; b.style.display=(c&&!b.dataset.open)?'inline-flex':'none';
        });
      }

      let spy;
      function observeHeadings(){ if(spy)spy.disconnect();
        spy=new IntersectionObserver(function(es){es.forEach(function(en){ if(en.isIntersecting){document.querySelectorAll('#toc a[data-target]').forEach(function(a){a.classList.toggle('active',a.dataset.target===en.target.id);});} });},{root:document.querySelector('.main'),rootMargin:'0px 0px -75% 0px',threshold:0});
        document.querySelectorAll('#toc a[data-target]').forEach(function(a){ if(a.dataset.doc!==activeDoc)return; const el=document.getElementById(a.dataset.target); if(el)spy.observe(el);});
      }

      // Per-decision confirmation copy — what the agent does with each verdict.
      const SENT={
        'Approve':          {cls:'approve',ico:'✓',wait:false,title:'Approved',sub:'Sent to the agent — it will proceed and implement the plan.'},
        'Request Revisions':{cls:'revise', ico:'',wait:true, title:'Revisions requested',sub:'Your notes are on their way. The agent will revise the plan; the updated version reloads here when it’s ready.'},
        'Reject':           {cls:'deny',   ico:'✕',wait:false,title:'Rejected',sub:'Sent to the agent — it will not implement this. It steps back to reconsider whether the feature should be built at all.'},
      };
      let submitting=false, decisionSent=false;
      function clearAllNotes(){
        annotations.slice().forEach(function(a){ if(a.kind==='note') unhighlight(a.id); });
        annotations.length=0; nextId=1; paint();
      }
      function showSent(decision){
        const cfg=SENT[decision]||SENT['Request Revisions'];
        document.getElementById('dbar-live').style.display='none';
        const ico=document.getElementById('sent-ico');
        ico.className='ico'+(cfg.wait?' dot':''); ico.textContent=cfg.wait?'':cfg.ico;
        document.getElementById('sent-title').textContent=cfg.title;
        document.getElementById('sent-sub').textContent=cfg.sub;
        document.getElementById('sent').className='sent show '+cfg.cls;
      }
      function resetDecisionUI(){
        document.getElementById('sent').className='sent';
        const a=document.getElementById('dbar-live'); a.style.display='';
        a.querySelectorAll('button').forEach(function(b){b.disabled=false;});
      }
      async function submit(decision){
        if(submitting) return; submitting=true;
        document.querySelectorAll('.dbar button').forEach(function(b){b.disabled=true;});
        try{
          // Send the thread in the SAME order the reviewer saw it. The rendered
          // thread is ordered by document position and each note is numbered in
          // the gutter; posting the raw insertion-order array would hand the
          // agent a different numbering than the one on screen, so "note 1" in a
          // conversation would mean two different notes.
          const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:decision,thread:threadOrder()})});
          if(!r.ok) throw new Error('status '+r.status);
          hideApiError();
          decisionSent=true;    // a terminal decision makes the server exit —
                                 // the SSE drop that follows is expected, not a fault
          clearAllNotes();      // notes clear the moment the decision is sent
          showSent(decision);
        }catch(e){
          showApiError('Could not send your decision — the review server may be unreachable. Nothing was sent; try again.');
          document.querySelectorAll('.dbar button').forEach(function(b){b.disabled=false;});
        }
        submitting=false;
      }
      document.getElementById('send').onclick=sendChat;
      document.getElementById('input').addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter')sendChat();});
      document.querySelectorAll('.dbar button[data-decision]').forEach(function(b){b.onclick=function(){submit(b.dataset.decision);};});

      // ---- Revision diff (self-contained line-level LCS, no deps) ----
      function lineDiff(a,b){
        const A=(a||'').replace(/\r\n/g,'\n').split('\n'), B=(b||'').replace(/\r\n/g,'\n').split('\n');
        const n=A.length,m=B.length; const dp=[]; for(let i=0;i<=n;i++)dp.push(new Int32Array(m+1));
        for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
          dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:(dp[i+1][j]>=dp[i][j+1]?dp[i+1][j]:dp[i][j+1]);
        const out=[]; let i=0,j=0;
        while(i<n&&j<m){ if(A[i]===B[j]){out.push({t:'ctx',s:A[i]});i++;j++;}
          else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:'del',s:A[i]});i++;}
          else{out.push({t:'add',s:B[j]});j++;} }
        while(i<n)out.push({t:'del',s:A[i++]}); while(j<m)out.push({t:'add',s:B[j++]});
        return out;
      }
      function renderDiff(diff){
        const view=document.getElementById('diffview'); view.innerHTML=''; const FOLD=6; let run=[];
        function line(t,s){ const el=document.createElement('div'); el.className='diffline '+t;
          const g=document.createElement('span'); g.className='g'; g.textContent=t==='add'?'+':t==='del'?'-':' ';
          el.appendChild(g); el.appendChild(document.createTextNode(s||' ')); view.appendChild(el); }
        function flush(){ if(!run.length)return;
          if(run.length>FOLD){ line('ctx',run[0].s); line('ctx',run[1].s);
            const f=document.createElement('div'); f.className='diffline fold'; f.textContent='⋯ '+(run.length-4)+' unchanged lines'; view.appendChild(f);
            line('ctx',run[run.length-2].s); line('ctx',run[run.length-1].s); }
          else run.forEach(function(r){line('ctx',r.s);}); run=[]; }
        diff.forEach(function(d){ if(d.t==='ctx')run.push(d); else{ flush(); line(d.t,d.s); } }); flush();
      }
      const diffwrap=document.getElementById('diffwrap');
      function setDiffView(on){
        diffwrap.classList.toggle('show',on);
        planEl.style.display=on?'none':'';
        document.getElementById('rb-toggle').textContent=on?'View rendered':'View changes';
      }
      function showRevBar(diff,doc){
        const adds=diff.filter(function(d){return d.t==='add';}).length;
        const dels=diff.filter(function(d){return d.t==='del';}).length;
        document.querySelector('#revbar .rb-text').textContent=(DIRMODE&&doc)?doc+' revised':'Plan revised';
        document.getElementById('rb-stat').textContent='+'+adds+' / -'+dels+' lines';
        renderDiff(diff); document.getElementById('revbar').classList.add('show'); setDiffView(false);
      }
      function hideRevBar(){ document.getElementById('revbar').classList.remove('show'); setDiffView(false); }
      document.getElementById('rb-toggle').onclick=function(){ setDiffView(!diffwrap.classList.contains('show')); };
      document.getElementById('rb-dismiss').onclick=hideRevBar;

      // ---- Files tab: paths the plan/spec touches ----
      // Heuristic scan of inline code + fence contents. Conservative on purpose:
      // false negatives are fine, noisy false positives are not.
      function considerPath(tok,set){
        tok=tok.replace(/^['"(<]+|[)>'".,;:!?]+$/g,'').replace(/^\.\//,'');
        if(!tok||tok.length>200||/\s/.test(tok)||tok.indexOf('://')>=0||tok[0]==='#'||tok[0]==='-') return;
        const segs=tok.split('/'); const last=segs[segs.length-1];
        const hasExt=/^[\w@-][\w@.-]*\.[A-Za-z][A-Za-z0-9]{0,5}$/.test(last);
        if(segs.length>=2&&/^[\w@.-]+(\/[\w@.-]+)+$/.test(tok)&&(hasExt||segs.length>=3)) set.add(tok);
      }
      function scanDocPaths(md,set){
        const lines=(md||'').replace(/\r\n/g,'\n').split('\n'); let inFence=false;
        lines.forEach(function(line){
          if(/^```/.test(line)){ inFence=!inFence; return; }
          if(inFence){ line.split(/\s+/).forEach(function(w){considerPath(w,set);}); return; }
          const re=/`([^`]+)`/g; let m;
          while((m=re.exec(line))){ m[1].split(/\s+/).forEach(function(w){considerPath(w,set);}); }
        });
      }
      const mentionCycle={};
      function jumpToMention(pth){
        const hits=[];
        docs.forEach(function(d){
          docState[d].pane.querySelectorAll('code').forEach(function(c){ if(c.textContent.indexOf(pth)>=0) hits.push({doc:d,el:c}); });
        });
        if(!hits.length) return;
        const i=(mentionCycle[pth]||0)%hits.length; mentionCycle[pth]=i+1;
        const h=hits[i];
        if(h.doc!==activeDoc) switchDoc(h.doc);
        h.el.scrollIntoView({behavior:'smooth',block:'center'});
        h.el.classList.add('mention-flash'); setTimeout(function(){h.el.classList.remove('mention-flash');},1200);
      }
      async function buildFilesIndex(){
        const set=new Set();
        docs.forEach(function(d){ scanDocPaths(docState[d].md,set); });
        const paths=Array.from(set).sort();
        let results={};
        try{ const r=await (await fetch('/api/verify-paths',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths:paths})})).json(); results=r.results||{}; }catch(e){}
        const box=document.getElementById('filelist'); box.innerHTML='';
        if(!paths.length){ box.innerHTML='<div class="none">No file paths mentioned.</div>'; return; }
        paths.forEach(function(pth){
          const a=document.createElement('a'); a.href='#'; a.className='file'; a.title=pth;
          const t=document.createElement('span'); t.className='t'; t.textContent=pth; a.appendChild(t);
          if(pth in results){
            const bd=document.createElement('span'); bd.className='badge '+(results[pth]?'badge-soft':'badge-warning');
            bd.textContent=results[pth]?'exists':'new'; a.appendChild(bd);
          }
          a.onclick=function(e){ e.preventDefault(); jumpToMention(pth); };
          box.appendChild(a);
        });
      }
      const tabC=document.getElementById('tab-contents'), tabF=document.getElementById('tab-files');
      function setTab(files){ tabC.classList.toggle('active',!files); tabF.classList.toggle('active',files);
        document.getElementById('pane-contents').style.display=files?'none':'';
        document.getElementById('pane-files').style.display=files?'':'none'; }
      tabC.onclick=function(){setTab(false);}; tabF.onclick=function(){setTab(true);};

      // ---- Load + live reload ----
      // null means "fetch failed" (error banner already shown) and is kept
      // distinct from '' so a transient failure can never masquerade as a
      // real empty document and trip the revised-doc diff below.
      function fetchDoc(doc){
        return fetch(DIRMODE?'/api/plan?doc='+encodeURIComponent(doc):'/api/plan')
          .then(function(r){ if(!r.ok) throw new Error('status '+r.status); hideApiError(); return r.text(); })
          .catch(function(e){ showApiError('Could not load "'+doc+'" — the review server may be unreachable.'); return null; });
      }
      async function reloadDoc(doc){
        if(!docState[doc]) return;
        const md=await fetchDoc(doc);
        if(md===null) return;   // load failed; state untouched, banner already shown
        const st=docState[doc];
        if(md===st.md) return;                   // spurious watch event, no content change
        const prev=st.md, revised=prev!==null;
        if(revised){
          // A revised doc invalidates its anchors. Drop that doc's notes only,
          // restore the decision bar, and diff old vs new for this round.
          annotations.slice().forEach(function(a){ if(a.doc===doc){ if(a.kind==='note')unhighlight(a.id); annotations.splice(annotations.indexOf(a),1); } });
          resetDecisionUI();
        }
        renderDocPane(doc,md); buildToc(); paint(); buildFilesIndex();
        if(revised){ if(doc!==activeDoc)switchDoc(doc); showRevBar(lineDiff(prev,md),doc); }
        else hideRevBar();
      }
      async function boot(){
        let meta={dir:false,docs:['plan']};
        try{
          const r=await fetch('/api/docs');
          if(!r.ok) throw new Error('status '+r.status);
          meta=await r.json();
          hideApiError();
        }catch(e){ showApiError('Could not reach the review server. Retry once it is back up.'); }
        DIRMODE=!!meta.dir; docs=meta.docs||[];
        // A directory with no markdown at all — nothing to render, nothing to
        // load per-doc. Show the empty state and stop before the doc loop.
        if(DIRMODE&&!docs.length){
          tocEl.innerHTML='';
          planEl.innerHTML='<div class="kit-empty"><p class="kit-empty__title">No documents to review</p>'
            +'<p class="kit-empty__body">This directory has no markdown files.</p></div>';
          paint();
          return;
        }
        // Accept-or-fix reviews hide the plan-only "Reject / don't build it"
        // verdict: directory (spec) review always — a spec documents work already
        // decided — and single-file review when the server was started with
        // --no-reject (discovery's design stage).
        if(DIRMODE||meta.noReject){ const rj=document.getElementById('btn-reject'); if(rj)rj.style.display='none'; }
        if(DIRMODE){
          document.getElementById('tree-filter').style.display='block';
          const qEl=document.getElementById('tree-q');
          qEl.oninput=function(){
            const v=qEl.value;
            if(v&&preFilterOpen===null) preFilterOpen=new Set(openFolders);   // snapshot on first keystroke
            treeFilter=v;
            if(!v&&preFilterOpen!==null){ openFolders=new Set(preFilterOpen); preFilterOpen=null;
              if(activeDoc)seedOpen(activeDoc); }          // doc switched while filtered — keep its ancestors open
            buildToc();
          };
          qEl.onkeydown=function(e){ if(e.key==='Escape'){ qEl.value=''; qEl.oninput(); qEl.blur(); } };
        }
        // Panes are built off-DOM and only swapped in once every doc has
        // resolved, so the .kit-skel placeholders already in #plan stay
        // visible for the whole fetch instead of being wiped to blank first.
        const frag=document.createDocumentFragment();
        docs.forEach(function(d,i){
          const pane=document.createElement('div'); pane.className='docpane'; pane.style.display='none';
          frag.appendChild(pane);
          docState[d]={md:null,pane:pane,scroll:0,key:'d'+i,headings:[]};
        });
        for(let i=0;i<docs.length;i++){ const d=docs[i]; const md=await fetchDoc(d); if(md!==null) renderDocPane(d,md); }
        planEl.innerHTML=''; planEl.appendChild(frag);
        if(!DIRMODE||!docs.length) buildToc();   // DIRMODE: switchDoc below builds the tree once, seeded
        paint();
        if(docs.length) switchDoc(docs[0]);
        buildFilesIndex();
      }
      try{
        const es=new EventSource('/api/events');
        es.onmessage=function(ev){
          hideApiError();
          const m=String((ev&&ev.data)||''); const doc=m.indexOf('change:')===0?m.slice(7):docs[0];
          reloadDoc(doc);
        };
        es.onerror=function(){ if(!decisionSent) showApiError('Live connection to the review server was lost — revised docs will not auto-reload. Your notes are safe.'); };
      }catch(e){ showApiError('Live reload is unavailable in this browser.'); }

      // SPECIMEN ONLY — seed a few notes so the review column has real content.
      function seedSpecimen() {
        const notes = [
          { find: 'sticky', cat: 'Issue', text: 'Confirm this measures the offset rather than hardcoding it — a wrapped strip changes the number.' },
          { find: 'changeset', cat: 'Question', text: 'Does this need to land before the version bump, or can it ride in the same commit?' },
          { find: 'token', cat: 'Praise', text: 'Good — deriving this from the core instead of restating it is what keeps the four surfaces honest.' },
        ];
        notes.forEach(function (n) {
          const walker = document.createTreeWalker(planEl, NodeFilter.SHOW_TEXT, null);
          let node;
          while ((node = walker.nextNode())) {
            const i = node.nodeValue.indexOf(n.find);
            if (i < 0 || !node.nodeValue.trim()) continue;
            const r = document.createRange();
            r.setStart(node, i); r.setEnd(node, i + n.find.length);
            const blk = blockOf(node);
            const id = nextId++;
            try { highlight(r, id); } catch (e) { continue; }
            annotations.push({
              id: id, kind: 'note', cat: n.cat, quote: n.find,
              text: n.text, section: blk ? blk.dataset.section : '(top)', doc: activeDoc,
            });
            break;
          }
        });
        paint();
      }
      boot().then(seedSpecimen);
    </script>
  </body>
</html>
