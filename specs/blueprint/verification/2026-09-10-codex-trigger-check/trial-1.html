<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerly system architecture</title>
  <style>
    /* Shared design core — do not hand-edit; edit scripts/tokens/core.css. */
    :root {
      --background: #111110;
      --card: #191918;
      --card-foreground: #eeeeec;
      --popover: #222221;
      --foreground: #eeeeec;
      --muted: #222221;
      --muted-foreground: #b5b3ad;
      --border: #3b3a37;
      --input: #3b3a37;
      --primary: #978365;
      --primary-foreground: #ffffff;
      --primary-hover: #a39073;
      --primary-muted: #24231f;
      --primary-text: #cbb99f;
      --ring: #978365;
      --accent: #2a2a28;
      --success: #71d083;
      --success-muted: #1b2a1e;
      --success-border: #2d5736;
      --warning: #ffca16;
      --warning-muted: #302008;
      --warning-border: #5c3d05;
      --destructive: #ff977d;
      --destructive-muted: #391714;
      --destructive-border: #6e2920;
      --info: #70b8ff;
      --info-muted: #0d2847;
      --info-border: #104d87;
      --cat-1: #cf686e;
      --cat-2: #897ed6;
      --cat-3: #41a265;
      --cat-4: #3694d4;
      --cat-5: #94911b;
      --cat-6: #ba6cae;
      --cat-7: #c37827;
      --cat-8: #00a0a4;
      --cat-other: #686560;
      --outline: rgba(237, 237, 236, 0.08);
      --subtle: #686560;
      --shadow-sm: 0 1px 2px rgba(6, 6, 5, 0.5);
      --shadow-md: 0 4px 14px rgba(6, 6, 5, 0.55);
      --shadow-lg: 0 20px 60px rgba(6, 6, 5, 0.62);
      --mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace;
      --sans: "Geist", "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --text-2xs: 0.6875rem;
      --text-xs: 0.75rem;
      --text-sm: 0.8125rem;
      --text-base: 0.875rem;
      --text-md: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.375rem;
      --text-2xl: 1.75rem;
      --text-3xl: 2.5rem;
      --text-4xl: 3.5rem;
      --leading-tight: 1.15;
      --leading-snug: 1.35;
      --leading-normal: 1.55;
      --leading-relaxed: 1.7;
      --tracking-tight: -0.022em;
      --tracking-normal: 0em;
      --tracking-wide: 0.06em;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-8: 3rem;
      --space-12: 4rem;
      --radius-sm: 0.1875rem;
      --radius: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-full: 9999px;
      --dur-fast: 120ms;
      --dur: 200ms;
      --dur-slow: 320ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --background: #f6f5ef;
        --card: #fcfbf6;
        --card-foreground: #36302a;
        --popover: #fcfbf6;
        --foreground: #36302a;
        --muted: #f0efe3;
        --muted-foreground: #726c5e;
        --border: #ddd6c6;
        --input: #ddd6c6;
        --primary: #967e60;
        --primary-foreground: #ffffff;
        --primary-hover: #897254;
        --primary-muted: #efece0;
        --primary-text: #6f5e44;
        --ring: #967e60;
        --accent: #eae7da;
        --success: #3f7a34;
        --success-muted: #e6f5e2;
        --success-border: #c2e1b3;
        --warning: #93761d;
        --warning-muted: #fbf4c4;
        --warning-border: #ebd87f;
        --destructive: #bf4f3b;
        --destructive-muted: #fbe8e2;
        --destructive-border: #f0c9ba;
        --info: #3f6fa6;
        --info-muted: #e6f1fc;
        --info-border: #bed7ef;
        --cat-1: #b04d54;
        --cat-2: #6f63b8;
        --cat-3: #1e874b;
        --cat-4: #0a78b7;
        --cat-5: #797600;
        --cat-6: #9d5192;
        --cat-7: #a45e00;
        --cat-8: #008f93;
        --cat-other: #a8a294;
        --outline: rgba(54, 48, 42, 0.08);
        --subtle: #a8a294;
        --shadow-sm: 0 1px 2px rgba(54, 48, 42, 0.1);
        --shadow-md: 0 4px 14px rgba(54, 48, 42, 0.13);
        --shadow-lg: 0 20px 60px rgba(54, 48, 42, 0.18);
      }
    }
    :root[data-theme="light"] {
      --background: #f6f5ef;
      --card: #fcfbf6;
      --card-foreground: #36302a;
      --popover: #fcfbf6;
      --foreground: #36302a;
      --muted: #f0efe3;
      --muted-foreground: #726c5e;
      --border: #ddd6c6;
      --input: #ddd6c6;
      --primary: #967e60;
      --primary-foreground: #ffffff;
      --primary-hover: #897254;
      --primary-muted: #efece0;
      --primary-text: #6f5e44;
      --ring: #967e60;
      --accent: #eae7da;
      --success: #3f7a34;
      --success-muted: #e6f5e2;
      --success-border: #c2e1b3;
      --warning: #93761d;
      --warning-muted: #fbf4c4;
      --warning-border: #ebd87f;
      --destructive: #bf4f3b;
      --destructive-muted: #fbe8e2;
      --destructive-border: #f0c9ba;
      --info: #3f6fa6;
      --info-muted: #e6f1fc;
      --info-border: #bed7ef;
      --cat-1: #b04d54;
      --cat-2: #6f63b8;
      --cat-3: #1e874b;
      --cat-4: #0a78b7;
      --cat-5: #797600;
      --cat-6: #9d5192;
      --cat-7: #a45e00;
      --cat-8: #008f93;
      --cat-other: #a8a294;
      --outline: rgba(54, 48, 42, 0.08);
      --subtle: #a8a294;
      --shadow-sm: 0 1px 2px rgba(54, 48, 42, 0.1);
      --shadow-md: 0 4px 14px rgba(54, 48, 42, 0.13);
      --shadow-lg: 0 20px 60px rgba(54, 48, 42, 0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--sans);
    }
    .frame {
      width: min(100% - 32px, 2140px);
      margin: 24px auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-md);
      overflow-x: auto;
    }
    h1 { margin: 0 0 8px; font-size: var(--text-2xl); letter-spacing: var(--tracking-tight); }
    p { margin: 0 0 20px; color: var(--muted-foreground); font-size: var(--text-sm); }
    svg { display: block; min-width: 2000px; font-family: var(--sans); }
    svg .data { font-family: var(--mono); }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Ledgerly system architecture</h1>
    <p>Request paths, JetStream event flows, owned stores, and external-provider calls.</p>

    <svg viewBox="0 0 2180 1080" font-size="13" style="max-width:100%" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Ledgerly service architecture</title>
      <desc id="diagram-desc">All nine Ledgerly services, HTTP request paths, NATS JetStream event flows, owned Postgres schemas and Redis cache, and external payment and messaging providers.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--subtle)"/>
        </marker>
      </defs>

      <!-- Boundaries are behind their members. -->
      <rect x="1360" y="18" width="250" height="616" rx="8" fill="var(--muted)" stroke="var(--border)" stroke-dasharray="6 4"/>
      <text x="1380" y="43" font-size="12" font-weight="600" fill="var(--muted-foreground)">Postgres cluster · service-owned schemas</text>

      <!-- Edges: request paths from web through the gateway. -->
      <path d="M 280 470 H 400" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="284" y="451" width="112" height="15" fill="var(--background)"/>
      <text class="data" x="340" y="463" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">GraphQL over HTTP</text>

      <path d="M 680 410 H 760 V 88 H 1000" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="856" y="69" width="120" height="15" fill="var(--background)"/>
      <text class="data" x="916" y="81" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">HTTP/JSON · orders</text>

      <path d="M 680 470 H 790 V 248 H 1000" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="850" y="233" width="126" height="15" fill="var(--background)"/>
      <text class="data" x="913" y="245" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">HTTP/JSON · catalog</text>

      <path d="M 680 530 H 820 V 408 H 1000" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="852" y="393" width="124" height="15" fill="var(--background)"/>
      <text class="data" x="914" y="405" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">HTTP/JSON · billing</text>

      <path d="M 540 590 V 650 H 900 V 568 H 1000" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="640" y="631" width="224" height="15" fill="var(--background)"/>
      <text class="data" x="752" y="643" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">HTTP/JSON · identity + session verify</text>

      <!-- Edges: owned data stores. -->
      <path d="M 1240 88 H 1390" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1250" y="69" width="130" height="15" fill="var(--muted)"/>
      <text class="data" x="1315" y="81" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owns orders schema</text>

      <path d="M 1240 248 H 1390" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1247" y="229" width="136" height="15" fill="var(--muted)"/>
      <text class="data" x="1315" y="241" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owns catalog schema</text>

      <path d="M 1240 408 H 1390" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1247" y="412" width="136" height="15" fill="var(--muted)"/>
      <text class="data" x="1315" y="424" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owns billing schema</text>

      <path d="M 1240 568 H 1390" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1244" y="549" width="142" height="15" fill="var(--muted)"/>
      <text class="data" x="1315" y="561" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owns identity schema</text>

      <!-- Edges: cache and synchronous provider calls. -->
      <path d="M 1240 266 H 1300 V 308 H 1750 V 286" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1660" y="289" width="80" height="15" fill="var(--background)"/>
      <text class="data" x="1700" y="301" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">Redis cache</text>

      <path d="M 1240 390 H 1320 V 360 H 1750 V 370" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1388" y="352" width="84" height="15" fill="var(--background)"/>
      <text class="data" x="1430" y="364" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">capture card</text>

      <path d="M 1910 408 H 1940 V 500 H 2050 V 446" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1948" y="481" width="94" height="15" fill="var(--background)"/>
      <text class="data" x="1995" y="493" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">processor API</text>

      <!-- Edges: event publication and subscriptions over NATS JetStream. -->
      <path d="M 1120 50 V 8 H 1640 V 718 H 1670" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1128" y="699" width="238" height="15" fill="var(--background)"/>
      <text class="data" x="1247" y="711" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">publish: order.placed + order.fulfilled</text>

      <path d="M 1670 738 H 930 V 470 H 1120 V 446" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1417" y="719" width="166" height="15" fill="var(--background)"/>
      <text class="data" x="1500" y="731" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">subscribe: order.placed</text>

      <path d="M 1890 738 H 1920 V 820 H 2050 V 756" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1979" y="787" width="142" height="29" fill="var(--background)"/>
      <text class="data" x="2050" y="799" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">order.placed +</text>
      <text class="data" x="2050" y="812" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">order.fulfilled</text>

      <path d="M 2130 718 H 2160 V 938 H 2130" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
      <rect x="1978" y="843" width="174" height="15" fill="var(--background)"/>
      <text class="data" x="2150" y="855" text-anchor="end" font-size="11" fill="var(--muted-foreground)">provider API · email/SMS</text>

      <!-- Service nodes. -->
      <g transform="translate(60,432)">
        <rect width="220" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="110" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">web</text>
        <text x="110" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">Next.js storefront + back office</text>
      </g>

      <g transform="translate(400,350)">
        <rect width="280" height="240" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="140" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="var(--foreground)">gateway</text>
        <text x="140" y="105" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">GraphQL API gateway</text>
        <text x="140" y="126" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">only ingress from web</text>
        <text x="140" y="147" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">HTTP/JSON fan-out</text>
        <text x="140" y="168" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">session verification via identity</text>
      </g>

      <g transform="translate(1000,50)">
        <rect width="240" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="120" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">orders</text>
        <text x="120" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">draft → placed → fulfilled → closed</text>
      </g>

      <g transform="translate(1000,210)">
        <rect width="240" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="120" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">catalog</text>
        <text x="120" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">product + price book</text>
      </g>

      <g transform="translate(1000,370)">
        <rect width="240" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="120" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">billing</text>
        <text x="120" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">invoices + payment capture</text>
      </g>

      <g transform="translate(1000,530)">
        <rect width="240" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="120" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">identity</text>
        <text x="120" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">users · roles · session tokens</text>
      </g>

      <g transform="translate(1670,370)">
        <rect width="240" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="120" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">payments-adapter</text>
        <text x="120" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">card processor wrapper</text>
      </g>

      <g transform="translate(1670,680)">
        <rect width="220" height="76" rx="6" fill="var(--primary-muted)" stroke="var(--primary)"/>
        <text x="110" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--primary-text)">bus</text>
        <text x="110" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">NATS JetStream event backbone</text>
      </g>

      <g transform="translate(1970,680)">
        <rect width="160" height="76" rx="6" fill="var(--card)" stroke="var(--border)"/>
        <text x="80" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="var(--foreground)">notifier</text>
        <text x="80" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">email + SMS</text>
      </g>

      <!-- Owned data stores. -->
      <g transform="translate(1390,50)">
        <rect width="190" height="76" rx="3" fill="var(--card)" stroke="var(--border)"/>
        <text class="data" x="95" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="var(--foreground)">orders schema</text>
        <text x="95" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owner: orders</text>
      </g>

      <g transform="translate(1390,210)">
        <rect width="190" height="76" rx="3" fill="var(--card)" stroke="var(--border)"/>
        <text class="data" x="95" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="var(--foreground)">catalog schema</text>
        <text x="95" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owner: catalog</text>
      </g>

      <g transform="translate(1390,370)">
        <rect width="190" height="76" rx="3" fill="var(--card)" stroke="var(--border)"/>
        <text class="data" x="95" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="var(--foreground)">billing schema</text>
        <text x="95" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owner: billing</text>
      </g>

      <g transform="translate(1390,530)">
        <rect width="190" height="76" rx="3" fill="var(--card)" stroke="var(--border)"/>
        <text class="data" x="95" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="var(--foreground)">identity schema</text>
        <text x="95" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owner: identity</text>
      </g>

      <g transform="translate(1670,210)">
        <rect width="240" height="76" rx="3" fill="var(--card)" stroke="var(--border)"/>
        <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="var(--foreground)">Redis cache</text>
        <text x="120" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">owned by catalog</text>
      </g>

      <!-- Systems outside Ledgerly's control. -->
      <g transform="translate(1970,370)">
        <rect width="160" height="76" rx="3" fill="var(--card)" stroke="var(--border)" stroke-dasharray="4 3"/>
        <text x="80" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="var(--foreground)">Card processor</text>
        <text x="80" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">external third party</text>
      </g>

      <g transform="translate(1970,900)">
        <rect width="160" height="76" rx="3" fill="var(--card)" stroke="var(--border)" stroke-dasharray="4 3"/>
        <text x="80" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="var(--foreground)">Messaging provider</text>
        <text x="80" y="51" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">external email/SMS</text>
      </g>

      <!-- Legend. -->
      <g transform="translate(60,900)">
        <rect width="470" height="120" rx="6" fill="var(--muted)" stroke="var(--border)"/>
        <text x="20" y="28" font-size="13" font-weight="600" fill="var(--foreground)">Reading the diagram</text>
        <text class="data" x="20" y="53" font-size="11" fill="var(--muted-foreground)">solid rounded box = Ledgerly service</text>
        <text class="data" x="20" y="74" font-size="11" fill="var(--muted-foreground)">solid square box = owned data store</text>
        <text class="data" x="20" y="95" font-size="11" fill="var(--muted-foreground)">dashed square box = external provider</text>
      </g>
    </svg>
  </main>
</body>
</html>
