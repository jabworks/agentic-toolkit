    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      background: var(--background);
      color: var(--foreground);
      padding: var(--space-6);
    }
    .frame {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      max-width: 1600px;
      margin: 0 auto;
      padding: var(--space-6);
    }
    h1 { font-size: var(--text-xl); letter-spacing: var(--tracking-tight); }
    .lede { color: var(--muted-foreground); margin: var(--space-2) 0 var(--space-5); }
    .diagram { overflow-x: auto; }
    svg { display: block; min-width: 1400px; }
    .service-title { font-family: var(--sans); font-weight: 600; fill: var(--foreground); }
    .node-detail, .edge-label, .tag { font-family: var(--mono); }
    .node-detail, .tag { fill: var(--muted-foreground); }
    .edge-label { fill: var(--muted-foreground); }
    .legend { display: flex; flex-wrap: wrap; gap: var(--space-5); margin-top: var(--space-4); color: var(--muted-foreground); font-family: var(--mono); font-size: var(--text-xs); }
    .legend span { display: inline-flex; align-items: center; gap: var(--space-2); }
    .swatch { width: var(--space-5); height: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .swatch.external { border-style: dashed; }
    .swatch.bus { background: var(--primary-muted); border-color: var(--primary); }

<body data-blueprint-mode="render">
  <main class="frame">
    <h1>Ledgerly system architecture</h1>
    <p class="lede">Synchronous request paths, JetStream event flows, owned persistence, and third-party boundaries.</p>

        </defs>

        <path d="M425 350 V105 H650" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M472 350 V245 H650" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M520 385 H650" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M472 420 V525 H650" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M840 525 H930 V595 H1030" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M1220 595 H1340" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M940 735 H1100" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>

        <!-- Edges: persistence ownership -->

        <path d="M840 228 H940 V210 H1030" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M840 262 H940 V287 H1030" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M840 385 H1030" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>
        <path d="M840 507 H1030" fill="none" stroke="var(--subtle)" marker-end="url(#arrow)"/>

        <!-- Edges: JetStream event flow -->
